[tools]
# mise run lint:versions checks that the Go and Node images have these versions.
go = "1.27.4"
golangci-lint = "2.15.0"
cocogitto = "7.0.0"
docker-compose = "5.7.1"
# Pin Node and pnpm only here, not also in web/.
node = "26.13.0"
pnpm = "12.16.1"
osv-scanner = "2.7.1"
helm = "4.3.2"
kubeconform = "0.8.0"
crane = "0.22.1"
syft = "1.57.2"
cosign = "3.1.4"
kind = "0.33.0"
kubectl = "1.37.2"
yq = "4.54.3"

[env]
# The image builds install this pnpm version, so that mise.toml is its only pin.
PNPM_VERSION = '''{{ exec(command=`awk -F'"' '/^pnpm = /{print $2}' "` ~ config_root ~ `/mise.toml"`) }}'''
# The profiles of the Compose commands other than cdrlab up, for example logs. cdrlab up sets its own profiles.
COMPOSE_PROFILES = "{{ get_env(name='COMPOSE_PROFILES', default='telemetry') }}"
# cdrlab runs the pinned Compose of [tools] (cli/cdrlab/design/compose-lab.md#cli-0136).
CDRLAB_COMPOSE = "docker-compose"

[vars]
# The -X flags in services/*/Dockerfile and cli/*/Dockerfile must match these variables.
build_env = """
export BUILD_COMMIT="$(git describe --always --dirty --abbrev=40 --exclude='*')"
export BUILD_COMMIT_SHORT="$(git describe --always --dirty --exclude='*')"
export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
export BUILD_ID="${BUILD_ID:-local}"
"""

# Connection to the lab PostgreSQL (compose.yaml) for the tests.
pg_env = """
export PGHOST="${PGHOST:-localhost}"
export PGUSER="${PGUSER:-postgres}"
export PGPASSWORD="${PGPASSWORD:-postgres}"
export PGDATABASE="${PGDATABASE:-postgres}"
export PGSSLMODE="${PGSSLMODE:-disable}"
"""

[tasks.hooks]
description = "Install the git hooks from cog.toml"
run = "cog install-hook --all --overwrite"

[tasks.tidy]
description = "Run go mod tidy"
run = "go mod tidy"

[tasks.fmt]
description = "Format all code"
depends = ["fmt:go", "fmt:web"]

[tasks."fmt:go"]
description = "Format the Go code"
run = "golangci-lint fmt ./..."

[tasks."fmt:web"]
description = "Format the web workspace"
depends = ["web:install"]
dir = "web"
run = "pnpm run fmt"

[tasks.lint]
description = "Lint all code"
depends = ["lint:go", "lint:web", "lint:versions", "lint:chart", "lint:spec"]

[tasks."chart:deps"]
description = "Get the chart dependencies of each Chart.lock"
run = """
for chart in charts/*/Chart.yaml; do
  helm dependency build --skip-refresh "${chart%/Chart.yaml}"
done
"""

# GHCR sometimes gives "not found" when helm push tags a new manifest, and a new push of the same package is safe.
[tasks."chart:push"]
description = "Push a chart package to an OCI repository, with up to 3 attempts"
usage = """
arg "<package>" help="The chart package (.tgz)"
arg "<repository>" help="The OCI repository, for example oci://ghcr.io/lukemundy/cdr-lab/charts"
"""
shell = "bash -c"
run = """
set -euo pipefail
for attempt in 1 2 3; do
  if helm push "$usage_package" "$usage_repository"; then
    exit 0
  fi
  if [ "$attempt" -lt 3 ]; then
    echo "helm push failed (attempt $attempt of 3). Try again in 10 seconds." >&2
    sleep 10
  fi
done
exit 1
"""

# ci/lint-values.yaml of each chart turns on each optional part. The API versions make the routes of the bjw-s
# library use the Gateway API v1. The schemas of the Gateway API and cert-manager resources come from the CRDs-catalog
# at a fixed commit.
[tasks."lint:chart"]
description = "Lint each chart, and check its manifests against the Kubernetes, Gateway API and cert-manager schemas"
depends = ["chart:deps"]
run = """
crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/04af58d740718c4dc719441bf39fb284c784f4a8/{{ "{{" }}.Group{{ "}}" }}/{{ "{{" }}.ResourceKind{{ "}}" }}_{{ "{{" }}.ResourceAPIVersion{{ "}}" }}.json'
for chart in charts/*/Chart.yaml; do
  dir=${chart%/Chart.yaml}
  helm lint --strict "$dir" --values "$dir/ci/test-values.yaml" --values "$dir/ci/lint-values.yaml"
  helm template test "$dir" --kube-version 1.36.0 --values "$dir/ci/test-values.yaml" --values "$dir/ci/lint-values.yaml" \
    --api-versions gateway.networking.k8s.io/v1/TLSRoute --api-versions gateway.networking.k8s.io/v1/HTTPRoute |
    kubeconform -strict -summary -kubernetes-version 1.36.0 -schema-location default -schema-location "$crds"
done
"""

[tasks."lint:go"]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

# The rules are in ADR 0024 and docs/spec/conventions.md.
[tasks."lint:spec"]
description = "Check the structure of the specifications that follow ADR 0024, the Verifies comments of the tests and the links with a fragment in the Markdown files"
run = "go run ./tools/speccheck"

[tasks."lint:versions"]
description = "Check that the Go and Node images have the versions of mise.toml"
run = '''
status=0
for pair in go:golang node:node; do
  tool=${pair%%:*} image=${pair#*:}
  want=$(awk -F'"' "/^$tool = /{print \$2}" mise.toml)
  for ref in $(grep -oh "docker.io/library/$image:[^@ ]*" services/*/Dockerfile cli/*/Dockerfile compose.yaml); do
    tag=${ref#*:}
    case "$tag" in
      "$want" | "$want"-*) ;;
      *) echo "$ref: the $tool version of mise.toml is $want" >&2; status=1 ;;
    esac
  done
done
exit $status
'''

[tasks."lint:web"]
description = "Type-check, lint and check the format of the web workspace"
depends = ["web:install"]
dir = "web"
run = "pnpm run lint"

[tasks.test]
description = "Run all tests"
depends = ["test:go", "test:web"]

[tasks."test:go"]
description = "Run the Go tests with the race detector. Database tests need the lab PostgreSQL."
depends = ["chart:deps"]
run = """
{{ vars.pg_env }}
go test -race github.com/lukemundy/cdr-lab/...
"""

[tasks."test:web"]
description = "Run the web tests in a real browser"
depends = ["build:web"]
dir = "web"
run = [
  # The locked Playwright version selects the browser version.
  "pnpm exec playwright install --only-shell chromium firefox",
  "pnpm run test",
]

[tasks."build:web"]
description = "Build the web workspace, for example the design tokens"
depends = ["web:install"]
dir = "web"
run = "pnpm run build"

[tasks.generate]
description = "Generate the committed files from their sources, for example the console API types (CI fails if this changes files)"
depends = ["web:install"]
dir = "web"
run = "pnpm --recursive run generate"

[tasks."test:lab-web"]
description = "Run the browser tests of the web UIs against the running lab deployment"
depends = ["web:install"]
dir = "web"
# Node trusts the lab public CA, so that the tests can call the CDR APIs of the Register with TLS verification.
# The data holder tests create their customers with the operator interface.
env = { REGISTER_INTERNAL_URL = "http://localhost:8080", REGISTER_PUBLIC_URL = "https://localhost:8081", DATAHOLDER_INTERNAL_URL = "http://localhost:8180", DATAHOLDER_OPERATOR_TOKEN = "lab-operator-token", DATAHOLDER_PUBLIC_URL = "https://localhost:8181", BANK_SITE_URL = "https://localhost:8185", NODE_EXTRA_CA_CERTS = "{{config_root}}/.lab/pki/public/root.crt" }
run = [
  "pnpm exec playwright install --only-shell chromium",
  "pnpm exec playwright test",
]

[tasks."web:install"]
description = "Install the web workspace dependencies from the lock file"
hide = true
dir = "web"
run = "pnpm install --frozen-lockfile"

[tasks.audit]
description = "Scan the Go and pnpm lock files for known vulnerabilities and malicious packages"
run = "osv-scanner scan --config osv-scanner.toml --lockfile go.mod --lockfile web/pnpm-lock.yaml"

[tasks.conformance]
description = "Run the conformance tests in the running lab deployment"
# With --use-aliases, the Register finds the tests at the host name conformance.
run = "docker-compose run --rm --use-aliases conformance"

[tasks.build]
description = "Build all service binaries and the web workspace"
depends = ["build:go", "build:web"]

[tasks."build:images"]
description = "Build the images of the lab deployment"
run = """
{{ vars.build_env }}
docker-compose build
"""

[tasks."build:index"]
description = "Build each image as an OCI image index for linux/amd64 and linux/arm64 in .lab/images/<name>/, with an SPDX SBOM"
usage = """
arg "<dir>..." help="The directory of each Dockerfile, for example services/register. The last element is the image name, and <dir>/cmd/<name> is the main package"
"""
shell = "bash -c"
run = """
{{ vars.build_env }}
set -euo pipefail
# The docker driver of the classic image store cannot build for more than one platform. Renovate does not update this pin.
buildkit=docker.io/moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
if ! docker buildx inspect cdr-lab >/dev/null 2>&1; then
  docker buildx create --name cdr-lab --driver docker-container --driver-opt "image=$buildkit"
fi
for dir in $usage_dir; do
  dir=${dir%/}
  name=$(basename "$dir")
  out=.lab/images/$name
  rm -rf "$out" "$out.spdx.json"
  # GitHub artifact attestations give the provenance and the SBOM, so BuildKit adds none.
  docker buildx build --builder cdr-lab --platform linux/amd64,linux/arm64 --provenance=false --sbom=false \
    --build-arg BUILD_COMMIT --build-arg BUILD_COMMIT_SHORT --build-arg BUILD_TIME --build-arg BUILD_ID \
    --build-arg PNPM_VERSION --file "$dir/Dockerfile" --output "type=oci,dest=$out,tar=false" .
  # The two platforms have the same Go modules, so one SBOM is for the index.
  syft scan "oci-dir:$out" --platform linux/amd64 --quiet --output "spdx-json=$out.spdx.json"
  missing=$(comm -23 \
    <(GOOS=linux GOARCH=amd64 go list -deps -json "./$dir/cmd/$name" | jq -r 'select(.Module) | .Module.Path' | sort -u) \
    <(jq -r '.packages[].name' "$out.spdx.json" | sort -u))
  if [ -n "$missing" ]; then
    printf 'The SBOM of %s does not list these Go modules:\\n%s\\n' "$name" "$missing" >&2
    exit 1
  fi
done
"""

# BuildKit puts the image index of the layout in index.json. The output is the blob, so its SHA-256 is its digest.
[tasks."image:manifest"]
description = "Print the manifest of the linux/amd64 image in .lab/images/<name>/ (build:index)"
usage = 'arg "<name>" help="The image name, for example register"'
quiet = true
run = """
set -eu
blobs=.lab/images/$usage_name/blobs/sha256
index=$(jq -r '.manifests[0] | select(.mediaType == "application/vnd.oci.image.index.v1+json") | .digest' \\
  ".lab/images/$usage_name/index.json")
manifest=$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' \\
  "$blobs/${index#sha256:}")
cat "$blobs/${manifest#sha256:}"
"""

# The archive has the index.json and the manifest.json of docker save, so that each image store of Docker loads the
# blobs as they are. The image ID is then the manifest digest (containerd image store) or the configuration digest
# (classic image store) in the layout.
[tasks."release:cdrlab"]
description = "Build the cdrlab release archive of one platform in <out>/, with the licence and the NOTICE file, the licence notices of its third-party code, and the SPDX SBOM of its binary (tools/release/DESIGN.md#rls-0115)"
usage = """
arg "<version>" help="The version of the binary, for example v0.3.1 or rehearsal-123"
arg "<os>" help="linux or darwin"
arg "<arch>" help="amd64 or arm64"
arg "<out>" help="The output directory"
"""
shell = "bash -c"
run = """
set -euo pipefail
{{ vars.build_env }}
name="cdrlab-$usage_version-$usage_os-$usage_arch"
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
mkdir -p "$work/licenses/go" "$usage_out"
cp LICENSE NOTICE "$work/licenses/"
go build -o "$work/notices" ./tools/notices
GOOS=$usage_os GOARCH=$usage_arch "$work/notices" ./cli/cdrlab/cmd/cdrlab > "$work/licenses/go/third-party-notices.txt"
buildinfo=github.com/lukemundy/cdr-lab/pkg/platform/buildinfo
CGO_ENABLED=0 GOOS=$usage_os GOARCH=$usage_arch go build -trimpath -o "$work/cdrlab" -ldflags="-s -w \
  -X $buildinfo.version=$usage_version -X $buildinfo.commit=$BUILD_COMMIT -X $buildinfo.commitShort=$BUILD_COMMIT_SHORT \
  -X $buildinfo.buildTime=$BUILD_TIME -X $buildinfo.id=$BUILD_ID" ./cli/cdrlab/cmd/cdrlab
# The same commit gives the same archive.
tar -c -C "$work" --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" \
  cdrlab licenses | gzip -n > "$usage_out/$name.tar.gz"
syft scan "file:$work/cdrlab" --quiet --output "spdx-json=$usage_out/$name.spdx.json"
"""

[tasks."image:load"]
description = "Load the linux/amd64 image in .lab/images/<name>/ (build:index) into Docker with the given image names"
usage = """
arg "<name>" help="The image name, for example register"
arg "<ref>..." help="The names of the image in Docker, with no tag, for example cdr-lab-register. The tag is latest"
"""
shell = "bash -c"
run = """
set -euo pipefail
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
mise run image:manifest "$usage_name" > "$work/image.json"
digest=sha256:$(sha256sum "$work/image.json" | cut -d' ' -f1)
jq --arg digest "$digest" '[$digest, .config.digest, .layers[].digest] | map("blobs/sha256/" + ltrimstr("sha256:"))' \\
  "$work/image.json" > "$work/files.json"
jq -n --slurpfile files "$work/files.json" \\
  '[{Config: $files[0][1], RepoTags: $ARGS.positional | map(. + ":latest"), Layers: $files[0][2:]}]' \\
  --args $usage_ref > "$work/manifest.json"
jq -n --slurpfile image "$work/image.json" --arg digest "$digest" --argjson size "$(stat -c %s "$work/image.json")" \\
  '{schemaVersion: 2, mediaType: "application/vnd.oci.image.index.v1+json", manifests: [$ARGS.positional[] | {
    mediaType: $image[0].mediaType, digest: $digest, size: $size,
    annotations: {"io.containerd.image.name": "docker.io/library/\\(.):latest", "org.opencontainers.image.ref.name": "latest"}
  }]}' --args $usage_ref > "$work/index.json"
mapfile -t files < <(jq -r '.[]' "$work/files.json")
tar -c -C ".lab/images/$usage_name" oci-layout "${files[@]}" -C "$work" index.json manifest.json | docker load
"""

# The image ID in Docker is the manifest digest (containerd image store) or the configuration digest (classic image store).
[tasks."image:check"]
description = "Fail when an image ID is not the linux/amd64 image in .lab/images/<name>/ (build:index)"
usage = """
arg "<name>" help="The image name, for example register"
arg "<id>" help="The image ID in Docker, for example of the container that a lab job tested"
"""
quiet = true
run = """
set -eu
manifest=sha256:$(mise run image:manifest "$usage_name" | sha256sum | cut -d' ' -f1)
config=$(mise run image:manifest "$usage_name" | jq -r .config.digest)
if [ "$usage_id" != "$manifest" ] && [ "$usage_id" != "$config" ]; then
  echo "The image ID '$usage_id' is not the linux/amd64 image of $usage_name: manifest $manifest, configuration $config." >&2
  exit 1
fi
"""

[tasks."build:go"]
description = "Build all service binaries and the cdrlab CLI into bin/"
run = """
{{ vars.build_env }}
p=github.com/lukemundy/cdr-lab/pkg/platform/buildinfo
go build -o bin/ -ldflags "-X $p.commit=$BUILD_COMMIT -X $p.commitShort=$BUILD_COMMIT_SHORT -X $p.buildTime=$BUILD_TIME -X $p.id=$BUILD_ID" github.com/lukemundy/cdr-lab/services/.../cmd/... github.com/lukemundy/cdr-lab/cli/.../cmd/...
"""

[tasks.up]
description = "Make the lab CAs and certificates, build and start the lab deployment, and wait until it is healthy. With --no-build, start the images that are there"
usage = """
arg "[service]..." help="Start only these services and their dependencies"
flag "--all-banks" help="Also start the three other preset banks (compose profile all-banks)"
flag "--no-build" help="Do not build the images. Use the images that are there, for example the images that CI loads"
flag "--no-telemetry" help="Do not start the telemetry backend, and export no telemetry"
"""
run = """
{{ vars.build_env }}
set -eu
set --
if [ "${usage_all_banks:-}" = true ]; then set -- "$@" -all-banks; fi
if [ "${usage_no_build:-}" = true ]; then set -- "$@" -no-build; fi
if [ "${usage_no_telemetry:-}" = true ]; then set -- "$@" -no-telemetry; fi
# lab/certificates.json gives the certificates (cli/cdrlab/design/compose-lab.md#cli-0147).
go run ./cli/cdrlab/cmd/cdrlab up -source "$@" ${usage_service:-}
"""

[tasks."cluster:up"]
description = "Create a kind cluster and install the umbrella chart in it with the images of the lab, as the cluster job of CI does"
depends = ["chart:deps"]
# The images of the register and wattle-bank compose services (mise run build:images, or the images that CI loads),
# and the image cdrlab (mise run build:index cli/cdrlab, then mise run image:load cdrlab cdrlab).
# CONFORMANCE_GO_CACHE, when it is set, is the host directory of the Go cache of the conformance suite.
shell = "bash -c"
run = """
set -euo pipefail
cluster=cdr-lab
k() { kubectl --context "kind-$cluster" --namespace lab "$@"; }
tag=$(git describe --always --dirty --exclude='*')
compose=$(docker-compose --profile test config --format json)
image_of() { jq --raw-output --arg service "$1" '.name as $project | .services[$service].image // "\\($project)-\\($service)"' <<< "$compose"; }

# The node gets the checkout and the certificate files of the suite (lab/kind/conformance.yaml).
mkdir -p .lab/kind/pki .lab/pki
{
  echo "kind: Cluster"
  echo "apiVersion: kind.x-k8s.io/v1alpha4"
  echo "nodes:"
  echo "  - role: control-plane"
  echo "    extraMounts:"
  echo "      - {hostPath: \\"$PWD\\", containerPath: /src, readOnly: true}"
  echo "      - {hostPath: \\"$PWD/.lab/kind/pki\\", containerPath: /pki}"
  if [ -n "${CONFORMANCE_GO_CACHE:-}" ]; then
    mkdir -p "$CONFORMANCE_GO_CACHE"
    echo "      - {hostPath: \\"$CONFORMANCE_GO_CACHE\\", containerPath: /cache}"
  fi
} > .lab/kind/cluster.yaml
kind create cluster --name "$cluster" --config .lab/kind/cluster.yaml --wait 2m

# A tag that is not latest, so that the kubelet uses the loaded image and does not pull.
for image in register:"$(image_of register)" dataholder:"$(image_of wattle-bank)" cdrlab:cdrlab; do
  docker tag "${image#*:}" "cdr-lab.local/${image%%:*}:$tag"
  kind load docker-image --name "$cluster" "cdr-lab.local/${image%%:*}:$tag"
done

helm install cert-manager oci://quay.io/jetstack/charts/cert-manager --version v1.21.3 --kube-context "kind-$cluster" \\
  --namespace cert-manager --create-namespace --set crds.enabled=true --wait --timeout 5m
kubectl --context "kind-$cluster" create namespace lab

# The lab users of lab/postgres/init.sql, and the operator token of compose.yaml.
k create secret generic lab-operator-token --from-literal=token=lab-operator-token
for user in register-owner:register_owner register-service:register \\
  wattle-bank-owner:wattle_bank_owner wattle-bank-service:wattle_bank; do
  k create secret generic "${user%%:*}" --type=kubernetes.io/basic-auth \\
    --from-literal=username="${user#*:}" --from-literal=password="${user#*:}"
done
k create configmap postgres-init --from-file=1-init.sql=lab/postgres/init.sql \\
  --from-file=2-roles.sql=lab/kind/roles.sql --from-file=3-grants.sql=lab/postgres/grants.sql
IMAGE=$(image_of postgres) yq '(select(.kind == "Deployment") | .spec.template.spec.containers[0].image) = strenv(IMAGE)' \\
  lab/kind/postgres.yaml | k apply --filename -
IMAGE=$(image_of mail) yq '(select(.kind == "Deployment") | .spec.template.spec.containers[0].image) = strenv(IMAGE)' \\
  lab/kind/mail.yaml | k apply --filename -
k apply --filename lab/kind/issuers.yaml
k wait --for=condition=Ready certificate/public-root-ca --timeout 2m
k create secret generic public-root \\
  --from-literal=ca.crt="$(k get secret public-root-ca --output jsonpath='{.data.ca\\.crt}' | base64 --decode)"
k wait --for=condition=Available deployment/postgres deployment/mail --timeout 5m

# The participants of the Register seed of compose, except the preset brands, which the chart gives.
jq --slurpfile preset charts/cdr-lab/files/preset-brands.json '
  ($preset[0].dataHolders | map(.legalEntityId)) as $presets |
  {participants: {
    dataHolders: [.dataHolders[] | select(.legalEntityId as $id | $presets | index($id) | not)],
    dataRecipients: .dataRecipients
  }}' services/register/seed/example.json > .lab/kind/participants.json

# The cluster:seed task installs the release again with the same files.
cat > .lab/kind/images.yaml << EOF
images:
  register: {repository: cdr-lab.local/register, tag: "$tag"}
  dataholder: {repository: cdr-lab.local/dataholder, tag: "$tag"}
  cdrlab: {repository: cdr-lab.local/cdrlab, tag: "$tag"}
EOF
helm install cdr-lab charts/cdr-lab --kube-context "kind-$cluster" --namespace lab \\
  --values lab/kind/values.yaml --values .lab/kind/participants.json --values .lab/kind/images.yaml \\
  --wait --timeout 10m
"""

[tasks."cluster:seed"]
description = "Check the seed Jobs in the kind cluster of cluster:up: a fresh deployment with the same values gives the same participants and customers, and an upgrade adds only a new customer"
shell = "bash -c"
run = """
set -euo pipefail
k() { kubectl --context kind-cdr-lab --namespace lab "$@"; }
helm_release() {
  helm "$1" cdr-lab charts/cdr-lab --kube-context kind-cdr-lab --namespace lab --values "$2" \\
    --values .lab/kind/participants.json --values .lab/kind/images.yaml --wait --timeout 10m
}
dir=.lab/kind/seed
mkdir -p "$dir"

# Waits for the seed Jobs of the current revision, and gives the log of each.
seed_logs() {
  local job
  for job in participants wattle-bank-customers; do
    k wait --for=condition=Complete "job/cdr-lab-$job-r$1" --timeout 10m > /dev/null
    k logs "$(k get pods --selector "job-name=cdr-lab-$job-r$1" --field-selector status.phase=Succeeded --output name)" \\
      > "$dir/$job.log"
  done
}

# The seed records from the consoles, with no identifier that a service makes, no time and no certificate, because
# these can differ after a fresh deployment. One load sets all times from one time, so the ages stay comparable.
snapshot() {
  # kubectl itself in the background, not the function k, so that the kill stops the forward.
  local forwards=()
  kubectl --context kind-cdr-lab --namespace lab port-forward service/register 18080:8080 > /dev/null & forwards+=($!)
  kubectl --context kind-cdr-lab --namespace lab port-forward service/wattle-bank 18180:8080 > /dev/null & forwards+=($!)
  for port in 18080 18180; do
    for _ in $(seq 30); do
      if (exec 3<> "/dev/tcp/127.0.0.1/$port") 2> /dev/null; then break; fi
      sleep 1
    done
  done
  get() { curl --fail --silent --show-error "http://localhost:$1$2"; }
  page() {
    local list
    list=$(get "$1" "$2?pageSize=100")
    if [ "$(jq '.totalRecords > 100' <<< "$list")" = true ]; then echo "More than 100 records at $2." >&2; return 1; fi
    jq '.data' <<< "$list"
  }

  {
    for kind in data-recipients data-holders; do
      page 18080 "/api/$kind" | jq --raw-output '.[].legalEntityId' | sort | while read -r id; do
        get 18080 "/api/$kind/$id"
      done
    done
  } | jq --slurp 'walk(if type == "object" then del(.lastUpdated, .version, .clientCertificateThumbprints) else . end)' \\
    > "$dir/participants-$1.json"

  page 18180 /api/customers | jq --raw-output '.[].customerNumber' | while read -r number; do
    get 18180 "/api/customers/$number" | jq --compact-output '.' | while read -r customer; do
      jq --raw-output '.accounts[].accountId' <<< "$customer" | while read -r account; do
        page 18180 "/api/customers/$number/accounts/$account/transactions"
      done | jq --slurp --argjson customer "$customer" '$customer + {transactions: .}'
    done
  done | jq --slurp '
    def seconds: sub("\\\\.[0-9]+"; "") | fromdateiso8601;
    ([.[].transactions[][].executionDateTime | seconds] | max) as $newest |
    sort_by(.emailAddress) | map(
      del(.customerNumber, .lastUpdated) |
      .accounts |= map(del(.accountId, .creationDate)) |
      .transactions |= map(map(
        .age = $newest - (.executionDateTime | seconds) |
        del(.transactionId, .postingDateTime, .executionDateTime, .valueDateTime))))' > "$dir/customers-$1.json"

  kill "${forwards[@]}"
  wait "${forwards[@]}" 2> /dev/null || true
}

# Gives only the paths of the values that differ, and no value, because a customer value must not go into the log.
same() {
  jq --null-input --exit-status --raw-output --slurpfile a "$1" --slurpfile b "$2" --arg name "$3" '
    def leaves: paths(type | IN("object", "array") | not);
    if $a[0] == $b[0] then "The \\($name) are the same.\\n" | halt_error(0) else
      [$a[0], $b[0] | leaves] | unique | map(. as $p | select(($a[0] | getpath($p)) != ($b[0] | getpath($p)))) |
      if . == [] then [["an empty list or a null value"]] end |
      "The \\($name) differ at these paths:\\n\\(map(map(tostring) | join(".")) | join("\\n"))\\n" | halt_error(1)
    end'
}

started=$(date +%s)
seed_logs 1
snapshot first

# A fresh deployment, with the steps of the chart README: the PostgreSQL pod gets new, empty databases.
helm uninstall cdr-lab --kube-context kind-cdr-lab --namespace lab --wait --timeout 5m
k delete secret cdr-ca-intermediate cdr-ca-bundle \\
  $(yq '.brands | keys | .[] | . + "-secure-tls"' lab/kind/values.yaml)
k rollout restart deployment/postgres
k rollout status deployment/postgres --timeout 5m
helm_release install lab/kind/values.yaml
seed_logs 1
snapshot second
same "$dir/participants-first.json" "$dir/participants-second.json" participants
same "$dir/customers-first.json" "$dir/customers-second.json" customers
echo "The second install gives the same records. Participants: $(jq length "$dir/participants-second.json"). \\
Customers: $(jq length "$dir/customers-second.json")."

yq '.brands["wattle-bank"].customers += [{"lastName": "Added", "emailAddress": "added.customer@wattlebank.test"}]' \\
  lab/kind/values.yaml > "$dir/upgrade-values.yaml"
helm_release upgrade "$dir/upgrade-values.yaml"
seed_logs 2
if grep --quiet '^added ' "$dir/participants.log"; then echo "The upgrade added a participant." >&2; exit 1; fi
want="1 customer created, $(jq length "$dir/customers-second.json") existed"
if [ "$(cat "$dir/wattle-bank-customers.log")" != "$want" ]; then
  echo "The customer Job of the upgrade did not give: $want" >&2
  exit 1
fi
echo "The upgrade added 1 customer and 0 participants. The check took $(( $(date +%s) - started )) s."
"""

[tasks."cluster:conformance"]
description = "Run the conformance tests as a Job in the kind cluster of cluster:up"
shell = "bash -c"
run = """
set -euo pipefail
k() { kubectl --context kind-cdr-lab --namespace lab "$@"; }
secret() { k get secret "$1" --output jsonpath="{.data.${2//./\\\\.}}" | base64 --decode; }

# The suite reads the files at the paths of compose.yaml, below .lab/pki, which the Job mounts from .lab/kind/pki.
pki=.lab/kind/pki
mkdir -p "$pki/cdr" "$pki/public" "$pki/conformance" "$pki/openid"
secret cdr-ca-bundle ca.crt > "$pki/cdr/ca-bundle.pem"
secret public-root ca.crt > "$pki/public/root.crt"
k wait --for=condition=Ready certificate/conformance-jwks --timeout 2m
secret conformance-jwks tls.crt > "$pki/conformance/jwks.crt"
secret conformance-jwks tls.key > "$pki/conformance/jwks.key"

# The port of lab/kind/values.yaml, which is not a port of the compose lab.
k port-forward service/register 18080:8080 > /dev/null &
forward=$!
trap 'kill $forward' EXIT
for _ in $(seq 30); do
  if (exec 3<> /dev/tcp/127.0.0.1/18080) 2> /dev/null; then break; fi
  sleep 1
done
# The client certificates of lab/certificates.json, with the keys as the flags of cdrlab cert issue.
go build -o bin/cdrlab github.com/lukemundy/cdr-lab/cli/cdrlab/cmd/cdrlab
export REGISTER_OPERATOR_TOKEN
REGISTER_OPERATOR_TOKEN=$(secret lab-operator-token token)
jq --compact-output --arg dir "$pki/" '.cdr[] | select(.kind == "client") |
  (.cert, .key) |= sub("^\\\\.lab/pki/"; $dir) | [to_entries[] | "-\\(.key)", .value]' lab/certificates.json |
  while read -r flags; do
    mapfile -t flags < <(jq --raw-output '.[]' <<< "$flags")
    bin/cdrlab cert issue -register-url http://localhost:18080 "${flags[@]}"
  done

# The Job has the image, the command and the environment of the conformance compose service. The Register has the
# records of only the brands of the release.
k delete job conformance --ignore-not-found --wait
presets=$(yq '.brands | keys | join(",")' lab/kind/values.yaml)
docker-compose --profile test config --format json | jq --arg presets "$presets" '.services.conformance |
  .environment.REGISTER_PRESET_BRANDS = $presets | {
  apiVersion: "batch/v1", kind: "Job", metadata: {name: "conformance"},
  spec: {backoffLimit: 0, activeDeadlineSeconds: 1800, template: {metadata: {labels: {app: "conformance"}}, spec: {
    restartPolicy: "Never", enableServiceLinks: false,
    containers: [{
      name: "conformance", image: .image, workingDir: .working_dir, command: .command,
      env: [.environment | to_entries[] | {name: .key, value: .value}],
      volumeMounts: [
        {name: "src", mountPath: "/src", readOnly: true},
        {name: "pki", mountPath: "/src/.lab/pki", readOnly: true},
        {name: "cache", mountPath: "/cache"}
      ]
    }],
    volumes: [
      {name: "src", hostPath: {path: "/src", type: "Directory"}},
      {name: "pki", hostPath: {path: "/pki", type: "Directory"}},
      {name: "cache", hostPath: {path: "/cache", type: "DirectoryOrCreate"}}
    ]
  }}}
}' | k apply --filename -
k apply --filename lab/kind/conformance.yaml

# The logs end when the container stops. The Job then has its result.
until k get pod --selector job-name=conformance --output name | grep --quiet .; do sleep 1; done
k wait --for=condition=Ready pod --selector job-name=conformance --timeout 10m || true
k logs --follow job/conformance || true
for _ in $(seq 60); do
  result=$(k get job conformance --output jsonpath='{.status.succeeded}/{.status.failed}')
  case "$result" in
    1/*) exit 0 ;;
    */?*) echo "The conformance Job failed." >&2; exit 1 ;;
  esac
  sleep 2
done
echo "The conformance Job has no result." >&2
exit 1
"""

[tasks."cluster:down"]
description = "Delete the kind cluster of cluster:up and its files"
run = ["kind delete cluster --name cdr-lab", "rm -rf .lab/kind"]

[tasks.openid-conformance]
description = "Run the OpenID FAPI 1.0 Advanced conformance suite against the data holder in the running lab"
# The suite is Java. Its browser trusts only the CAs of this truststore.
# With --use-aliases, the data holder finds the JWKS of the clients at the host name openid-runner.
run = """
if [ ! -f .lab/pki/openid/truststore.p12 ]; then
  openssl pkcs12 -export -nokeys -in .lab/pki/public/root.crt -jdktrust anyExtendedKeyUsage \
    -passout pass:lab-truststore -out .lab/pki/openid/truststore.p12 && chmod 644 .lab/pki/openid/truststore.p12 || exit 1
fi
docker-compose --profile openid run --rm --use-aliases openid-runner
"""

[tasks.down]
description = "Stop the lab deployment and keep its data"
run = "go run ./cli/cdrlab/cmd/cdrlab down"

[tasks.reset]
description = "Stop the lab deployment and delete its data and its CAs"
run = "go run ./cli/cdrlab/cmd/cdrlab reset"
