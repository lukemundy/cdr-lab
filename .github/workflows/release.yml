name: release

# A maintainer starts each run by hand, from main (tools/release/DESIGN.md). Thus no job runs for a pull request.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: The full commit ID of the release commit, on main
        required: true
        type: string
      mode:
        description: check runs the checks and writes the notes. rehearse also pushes and signs, with the rehearsal names. release publishes the version.
        required: true
        default: check
        type: choice
        options: [check, rehearse, release]

permissions:
  contents: read

# Two releases never run at the same time, and a new run never cancels a release that runs.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    # The identity of each signature is this workflow on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      charts: ${{ steps.plan.outputs.charts }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          # The checks read the history and the tags of main.
          fetch-depth: 0

      - &install-mise
        name: Install Mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.8
          cache_save: false

      - name: Check the release and write the notes
        id: plan
        env:
          COMMIT: ${{ inputs.commit }}
          MODE: ${{ inputs.mode }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plan"
          mise exec -- go run ./tools/release plan -rev "$COMMIT" -mode "$MODE" -run-id "$GITHUB_RUN_ID" \
            -image-prefix "ghcr.io/$GITHUB_REPOSITORY" -github-repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/plan/plan.json"
          mise exec -- go run ./tools/release notes -plan "$RUNNER_TEMP/plan/plan.json" >> "$GITHUB_STEP_SUMMARY"
          echo "charts=$(jq --compact-output .charts "$RUNNER_TEMP/plan/plan.json")" >> "$GITHUB_OUTPUT"

      - name: Upload the plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan
          path: ${{ runner.temp }}/plan/plan.json
          if-no-files-found: error

  # The tag of each image points to the digest of its image commit. The release builds no image.
  images:
    needs: plan
    if: github.ref == 'refs/heads/main' && inputs.mode != 'check'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - *install-mise

      - &download-plan
        name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: ${{ runner.temp }}/plan

      - name: Tag and sign the images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/plan/plan.json"
          tag=$(jq --raw-output .imageTag "$plan")
          mise exec -- crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          jq --compact-output '.images[]' "$plan" | while read -r image; do
            source=$(jq --raw-output .source <<< "$image")
            target=$(jq --raw-output .target <<< "$image")
            digest=$(jq --raw-output .digest <<< "$image")
            mise exec -- crane copy "$source@$digest" "$target:$tag"
            got=$(mise exec -- crane digest "$target:$tag")
            if [ "$got" != "$digest" ]; then
              echo "$target:$tag has the digest $got, not the digest $digest of the image commit" >&2
              exit 1
            fi
            mise exec -- cosign sign --yes "$target@$digest"
          done

      - &logout
        name: Log out of the registry
        if: always()
        run: mise exec -- crane auth logout ghcr.io

  charts:
    needs: [plan, images]
    if: github.ref == 'refs/heads/main' && inputs.mode != 'check'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        chart: ${{ fromJSON(needs.plan.outputs.charts) }}
    steps:
      - *checkout

      - *install-mise

      - *download-plan

      - name: Package, push and sign the chart
        id: push
        env:
          CHART: ${{ matrix.chart }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/plan/plan.json"
          version=$(jq --raw-output .chartVersion "$plan")
          repository=$(jq --raw-output .chartRepository "$plan")
          mise exec -- crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          mise run chart:deps
          helm package "charts/$CHART" --version "$version" --app-version "$(jq --raw-output .imageTag "$plan")" \
            --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/$CHART-$version.tgz" "$repository"
          helm registry logout ghcr.io
          name="${repository#oci://}/$CHART"
          digest=$(mise exec -- crane digest "$name:$version")
          mise exec -- cosign sign --yes "$name@$digest"
          mkdir -p "$RUNNER_TEMP/digest"
          echo "$digest" > "$RUNNER_TEMP/digest/$CHART"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # A storage record needs one more permission, and the registry already has the attestation.
          create-storage-record: false

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart-digest-${{ matrix.chart }}
          path: ${{ runner.temp }}/digest/${{ matrix.chart }}
          if-no-files-found: error

      - *logout

  notes:
    needs: [plan, charts]
    if: github.ref == 'refs/heads/main' && inputs.mode != 'check'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - *checkout

      - *install-mise

      - *download-plan

      - name: Download the chart digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: chart-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digest

      - name: Write the notes
        run: |
          set -euo pipefail
          mise exec -- go run ./tools/release notes -plan "$RUNNER_TEMP/plan/plan.json" \
            -chart-digests "$RUNNER_TEMP/digest" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error

  # The GitHub Release is a draft until each artifact has its version, its signature and its attestations. The
  # publication makes the git tag, so a failure before it leaves no tag and no published release.
  github-release:
    needs: [plan, notes]
    if: github.ref == 'refs/heads/main' && inputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - *download-plan

      - name: Download the notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: ${{ runner.temp }}

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(jq --raw-output .version "$RUNNER_TEMP/plan/plan.json")
          commit=$(jq --raw-output .commit "$RUNNER_TEMP/plan/plan.json")
          # A failed release can leave a draft. A published release has its tag, so the plan refuses its version.
          if [ "$(gh release view "$version" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$version" --yes
          fi
          gh release create "$version" --draft --target "$commit" --title "$version" \
            --notes-file "$RUNNER_TEMP/notes.md"
          gh release edit "$version" --draft=false
