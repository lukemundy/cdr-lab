name: ci

on:
  push:
    branches: [main]
    # The changes job skips the other jobs for a change to Markdown only, because the spec job checks Markdown.
    paths-ignore: &paths-ignore
      - renovate.json
  pull_request:
    paths-ignore: *paths-ignore
  # A weekly scan of the lock files for new advisories. The schedule runs only the audit job.
  schedule:
    - cron: "0 20 * * 0"
  # The auto-merge workflow starts this run after it merges, because GitHub starts no push run for its merge.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run that it replaces, and other runs never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# CI starts the lab with no telemetry (mise run up --no-telemetry). These values give the same to the other Compose commands.
env:
  COMPOSE_PROFILES: ""
  LAB_OTLP_ENDPOINT: ""
  REGISTER_IMAGE: ghcr.io/${{ github.repository }}/register
  DATAHOLDER_IMAGE: ghcr.io/${{ github.repository }}/dataholder
  DATARECIPIENT_IMAGE: ghcr.io/${{ github.repository }}/datarecipient
  CDRLAB_IMAGE: ghcr.io/${{ github.repository }}/cdrlab

jobs:
  # Each job runs only when one of its inputs changes. A run with no base commit runs all jobs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.diff.outputs.go }}
      conformance: ${{ steps.diff.outputs.conformance }}
      web: ${{ steps.diff.outputs.web }}
      register-image: ${{ steps.diff.outputs.register-image }}
      dataholder-image: ${{ steps.diff.outputs.dataholder-image }}
      datarecipient-image: ${{ steps.diff.outputs.datarecipient-image }}
      cdrlab-image: ${{ steps.diff.outputs.cdrlab-image }}
      audit: ${{ steps.diff.outputs.audit }}
      chart: ${{ steps.diff.outputs.chart }}
      cluster: ${{ steps.diff.outputs.cluster }}
      spec: ${{ steps.diff.outputs.spec }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base is the first parent of the merge commit of a pull request, or of the squash commit of a push to main.
          fetch-depth: 2

      - name: Find the changed inputs
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) git cat-file -e "$BEFORE^{commit}" 2>/dev/null && base="$BEFORE" || true ;;
          esac

          # Prints true when a path changed, when there is no base, or when git diff fails.
          changed_all() {
            if [ -n "$base" ] && git diff --quiet "$base" HEAD -- "$@"; then echo false; else echo true; fi
          }
          # As changed_all, but a change to Markdown or to docs/ does not count.
          changed() {
            changed_all "$@" ':(exclude)*.md' ':(exclude)docs'
          }

          shared=(mise.toml .github/workflows/ci.yml)
          backend=(go.mod go.sum composeproject.go lab pkg cli services conformance compose.yaml)
          if [ "$EVENT" = schedule ]; then
            printf '%s\n' go=false conformance=false web=false register-image=false dataholder-image=false \
              datarecipient-image=false cdrlab-image=false audit=true chart=false cluster=false spec=false \
              >> "$GITHUB_OUTPUT"
          else
            {
              # Go tests check the brand directory contract against the token names and the fonts of the design system.
              # The test fixtures of tools/ are Markdown, so each change in tools/ counts.
              go=$(changed "${shared[@]}" "${backend[@]}" .golangci.yml web/packages/tokens/tokens \
                web/packages/tokens/fonts.json)
              if [ "$(changed_all tools)" = true ]; then go=true; fi
              echo "go=$go"
              conformance=$(changed "${shared[@]}" "${backend[@]}" .dockerignore)
              echo "conformance=$conformance"
              echo "web=$(changed "${shared[@]}" web services/register/internal/adapter/console/openapi.yaml \
                services/dataholder/internal/adapter/console/openapi.yaml \
                services/dataholder/internal/adapter/banksite/openapi.yaml services/dataholder/brands \
                services/dataholder/internal/adapter/consumerpages/testdata services/datarecipient/brands)"
              # The cluster job runs when an input of an image, a chart or the conformance suite changes.
              cluster=$conformance
              # The image inputs file gives the pathspecs of each image, also the excludes. The release reads the same file.
              for image in register dataholder datarecipient cdrlab; do
                mapfile -t inputs < <(jq --raw-output --arg image "$image" '.[$image][]' .github/image-inputs.json)
                image_changed=$(changed_all "${inputs[@]}")
                echo "$image-image=$image_changed"
                if [ "$image_changed" = true ]; then cluster=true; fi
              done
              echo "audit=$(changed "${shared[@]}" osv-scanner.toml go.mod go.sum web/pnpm-lock.yaml)"
              chart=$(changed "${shared[@]}" charts go.mod go.sum)
              echo "chart=$chart"
              if [ "$chart" = true ]; then cluster=true; fi
              echo "cluster=$cluster"
              # The specifications, the Go imports that their library tables give, and the Verifies comments of the tests.
              echo "spec=$(changed_all "${shared[@]}" tools/speccheck '*.md' '*.go' '*.ts' '*.tsx')"
            } >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only main saves a cache, so that a pull request cannot change the cache that other runs use.
      - &install-mise
        name: Install Mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.14
          cache_save: ${{ github.event_name == 'push' }}

      - name: Restore the Go and golangci-lint caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: go-lint-${{ hashFiles('go.sum', 'mise.toml') }}-${{ github.sha }}
          restore-keys: go-lint-${{ hashFiles('go.sum', 'mise.toml') }}-

      - name: Tidy
        run: mise run tidy && git diff --exit-code

      - name: Lint
        run: mise run lint:go

      - name: Check the Go and Node image versions
        run: mise run lint:versions

      # Only main saves a cache, so that a pull request cannot change the cache that other runs use.
      - name: Save the Go and golangci-lint caches
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: ${{ steps.cache.outputs.cache-primary-key }}

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *install-mise

      - name: Restore the Go caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ hashFiles('go.sum', 'mise.toml') }}-${{ github.sha }}
          restore-keys: go-test-${{ hashFiles('go.sum', 'mise.toml') }}-

      - name: Start PostgreSQL
        run: docker-compose up --detach --wait postgres

      - name: Test
        env:
          # Without this flag, Go uses the test results in the restored cache.
          GOFLAGS: -count=1
        run: mise run test:go

      - name: Build
        env:
          BUILD_ID: ${{ github.run_id }}
        run: mise run build:go

      - name: Save the Go caches
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The lab jobs and the cluster job load these images, so that parallel jobs do not each build the same images. The
  # cluster job runs for each input of the images, thus this job runs for it.
  images:
    needs: changes
    if: needs.changes.outputs.cluster == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *install-mise

      # One build makes the image of both platforms. The lab jobs test its linux/amd64 image, and the publish jobs push
      # the same layout, so the published linux/amd64 image is the tested image.
      - name: Build the image indexes
        env:
          BUILD_ID: ${{ github.run_id }}
        run: mise run build:index services/register services/dataholder services/datarecipient

      # Each compose service that builds from services/<name>/Dockerfile gets the linux/amd64 image of the layout.
      - name: Load the linux/amd64 images
        run: |
          set -euo pipefail
          config=$(docker-compose config --format json)
          for name in register dataholder datarecipient; do
            mapfile -t tags < <(jq -r --arg file "services/$name/Dockerfile" \
              '.name as $project | .services | to_entries[] | select(.value.build.dockerfile == $file) |
                .value.image // "\($project)-\(.key)"' <<< "$config")
            mise run image:load "$name" "${tags[@]}"
            for tag in "${tags[@]}"; do
              mise run image:check "$name" "$(docker image inspect --format '{{.Id}}' "$tag")"
            done
          done

      # The images that have no registry in their name are the images that compose builds.
      - name: Save the images
        run: |
          set -euo pipefail
          docker save $(docker-compose config --images | grep -v /) --output "$RUNNER_TEMP/images.tar"

      - name: Upload the images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: ${{ runner.temp }}/images.tar
          retention-days: 1
          if-no-files-found: error

      # Only main publishes images.
      - name: Upload the Register image index
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: register-index
          path: |
            .lab/images/register/
            .lab/images/register.spdx.json
          retention-days: 1
          # The layout is in .lab/, and the action leaves out hidden files by default.
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload the data holder image index
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dataholder-index
          path: |
            .lab/images/dataholder/
            .lab/images/dataholder.spdx.json
          retention-days: 1
          # The layout is in .lab/, and the action leaves out hidden files by default.
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload the data recipient image index
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: datarecipient-index
          path: |
            .lab/images/datarecipient/
            .lab/images/datarecipient.spdx.json
          retention-days: 1
          # The layout is in .lab/, and the action leaves out hidden files by default.
          include-hidden-files: true
          if-no-files-found: error

      # The kernel messages can give the cause of a "Bus error" in the web build, which occurs only on hosted runners.
      - name: Show the kernel messages
        if: failure() && runner.environment == 'github-hosted'
        run: sudo dmesg | tail -n 50

  conformance:
    needs: [changes, images]
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - *install-mise

      # The pki and up tasks of the lab deployment compile cdrlab on the runner.
      - name: Restore the Go caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/conformance-go
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-conformance-${{ hashFiles('go.sum', 'mise.toml') }}-${{ github.sha }}
          restore-keys: go-conformance-${{ hashFiles('go.sum', 'mise.toml') }}-

      # No job starts the other preset banks, so this check finds a fault in their services before a lab starts them.
      - name: Check the compose file with the all-banks profile
        run: docker-compose --profile all-banks config --quiet

      - &download-images
        name: Download the images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: ${{ runner.temp }}

      - name: Start the lab deployment
        run: docker load --input "$RUNNER_TEMP/images.tar" && mise run up --no-build --no-telemetry

      - name: Run the conformance tests
        run: CONFORMANCE_GO_CACHE="$HOME/.cache/conformance-go" mise run conformance

      - name: Save the Go caches
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/conformance-go
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Show the service logs
        if: failure()
        run: docker-compose logs

      - name: Stop the lab deployment
        if: always()
        run: mise run reset

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *install-mise

      - name: Find the pnpm store
        id: store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm store and the browsers
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.store.outputs.path }}
            ~/.cache/ms-playwright
          key: web-${{ hashFiles('web/pnpm-lock.yaml', 'mise.toml') }}-${{ github.sha }}
          restore-keys: web-${{ hashFiles('web/pnpm-lock.yaml', 'mise.toml') }}-

      # Fails when the lock file is not current, when a dependency has a build script that allowBuilds does not name,
      # or when a version is newer than the minimum release age (web/pnpm-workspace.yaml).
      - name: Install from the lock file
        run: mise run web:install

      - name: Check the registry signatures
        run: pnpm audit signatures

      # Also fails for a new generated file that is not committed.
      - name: Check the generated files
        run: |
          mise run generate
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Lint
        run: mise run lint:web

      - name: Test
        run: mise run test:web

      - name: Save the pnpm store and the browsers
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.store.outputs.path }}
            ~/.cache/ms-playwright
          key: ${{ steps.cache.outputs.cache-primary-key }}

  register-image:
    needs: [changes, images]
    if: needs.changes.outputs.register-image == 'true'
    runs-on: ubuntu-latest
    outputs:
      tested-image: ${{ steps.tested.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *install-mise

      # The pki and up tasks compile cdrlab on the runner. This job does not save the caches of the conformance and web jobs.
      - name: Restore the Go caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-conformance-${{ hashFiles('go.sum', 'mise.toml') }}-${{ github.sha }}
          restore-keys: go-conformance-${{ hashFiles('go.sum', 'mise.toml') }}-

      - name: Find the pnpm store
        id: store
        working-directory: web
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm store and the browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.store.outputs.path }}
            ~/.cache/ms-playwright
          key: web-${{ hashFiles('web/pnpm-lock.yaml', 'mise.toml') }}-${{ github.sha }}
          restore-keys: web-${{ hashFiles('web/pnpm-lock.yaml', 'mise.toml') }}-

      - *download-images

      - name: Start the Register
        run: docker load --input "$RUNNER_TEMP/images.tar" && mise run up --no-build --no-telemetry register

      - name: Check that the Register image has no Node
        run: |
          set -euo pipefail
          files=$(docker export "$(docker-compose ps --quiet register)" | tar -t)
          if grep -E '(^|/)(node|node_modules|npm|pnpm)(/|$)' <<< "$files"; then
            echo "The Register image contains Node or npm packages." >&2
            exit 1
          fi

      - name: Run the browser tests
        run: mise run test:lab-web --project register-console

      # The publish job pushes the image only when it is this tested image.
      - name: Record the tested Register image
        id: tested
        run: echo "id=$(docker inspect --format '{{.Image}}' "$(docker-compose ps --quiet register)")" >> "$GITHUB_OUTPUT"

      - name: Show the service logs
        if: failure()
        run: docker-compose logs

      - name: Stop the lab deployment
        if: always()
        run: mise run reset

  # A test job that fails or is cancelled stops the publish, but a test job that its path filter skipped does not.
  register-image-publish:
    needs: [lint, test, conformance, web, register-image]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !cancelled() && !failure() &&
      needs.register-image.result == 'success'
    runs-on: ubuntu-latest
    # Only this job of the image gets the permissions to push and to attest, and it never runs for a pull request.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *install-mise

      - name: Publish the Register image
        uses: ./.github/actions/publish-image
        with:
          name: register
          image: ${{ env.REGISTER_IMAGE }}
          tested-image: ${{ needs.register-image.outputs.tested-image }}

  # The chart job also runs for a new image, because CI then publishes the charts with the new image.
  chart:
    needs: changes
    if: >-
      needs.changes.outputs.chart == 'true' || needs.changes.outputs.register-image == 'true' ||
      needs.changes.outputs.dataholder-image == 'true' || needs.changes.outputs.datarecipient-image == 'true' ||
      needs.changes.outputs.cdrlab-image == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *install-mise

      - name: Lint
        run: mise run lint:chart

      - name: Test
        run: mise exec -- go test ./charts/...

  # The chart waits for the image publish jobs of its commit. A failed or cancelled image publish stops it.
  chart-publish:
    needs: [changes, chart, register-image-publish, dataholder-image-publish, datarecipient-image-publish]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !cancelled() && !failure() &&
      needs.chart.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The image commit can be an earlier commit of main.
          fetch-depth: 0

      - *install-mise

      # A SemVer prerelease cannot start with a zero digit, so the version has a g before the short commit ID.
      # Each chart gets the version of the commit, so a push never changes the version of a different commit.
      # The chart directory name is the service directory name. The appVersion is the image commit of the service,
      # and the tool fails when the image of a later change to an input is not published.
      - name: Push the charts
        env:
          GH_TOKEN: ${{ github.token }}
          CHART_REPOSITORY: oci://ghcr.io/${{ github.repository }}/charts
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          CHART_CHANGED: ${{ needs.changes.outputs.chart }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          commit=$(git describe --always --exclude='*')
          mise run chart:deps
          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          for chart in charts/*/Chart.yaml; do
            dir=${chart%/Chart.yaml}
            service=${dir#charts/}
            # The cdr-lab-chart-publish job publishes the umbrella chart, after the cluster job.
            if [ "$service" = cdr-lab ]; then
              continue
            fi
            published=$(jq --raw-output --arg job "$service-image-publish" '.[$job].result' <<< "$NEEDS")
            if [ "$CHART_CHANGED" != true ] && [ "$published" != success ]; then
              continue
            fi
            app=$(mise exec -- go run ./tools/release image-commit -service "$service" -image "$IMAGE_REPOSITORY/$service")
            # The Apache License 2.0 requires the licence and the NOTICE file with each copy of the chart.
            cp LICENSE NOTICE "$dir/"
            helm package "$dir" --version "0.0.0-g$commit" --app-version "$app" --destination "$RUNNER_TEMP"
            mise run chart:push "$RUNNER_TEMP/$service-0.0.0-g$commit.tgz" "$CHART_REPOSITORY"
          done
          helm registry logout ghcr.io

  # The umbrella chart in a kind cluster, with the conformance suite as a Job in the cluster. It builds no image.
  cluster:
    needs: [changes, images, cdrlab-image]
    if: needs.changes.outputs.cluster == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *install-mise

      # The suite compiles in the Job, with the Go cache of the conformance job. The cdrlab CLI compiles on the runner.
      - name: Restore the Go caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/conformance-go
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-conformance-${{ hashFiles('go.sum', 'mise.toml') }}-${{ github.sha }}
          restore-keys: go-conformance-${{ hashFiles('go.sum', 'mise.toml') }}-

      - *download-images

      - name: Download the cdrlab image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cdrlab-image
          path: ${{ runner.temp }}

      - name: Install the umbrella chart in a kind cluster
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/images.tar"
          docker load --input "$RUNNER_TEMP/cdrlab.tar"
          CONFORMANCE_GO_CACHE="$HOME/.cache/conformance-go" mise run cluster:up

      # Before the suite, because the suite changes the statuses of participants and adds customers.
      - name: Check the seed Jobs with a fresh deployment and an upgrade
        run: mise run cluster:seed

      - name: Run the conformance tests in the cluster
        run: mise run cluster:conformance

      - name: Show the state of the cluster
        if: failure()
        run: |
          kubectl --context kind-cdr-lab --namespace lab get pods,jobs,certificates,secrets
          kubectl --context kind-cdr-lab --namespace lab get events --sort-by=.lastTimestamp
          for pod in $(kubectl --context kind-cdr-lab --namespace lab get pods --output name); do
            echo "::group::$pod"
            kubectl --context kind-cdr-lab --namespace lab logs "$pod" --all-containers --prefix || true
            echo "::endgroup::"
          done

      - name: Delete the cluster
        if: always()
        run: mise run cluster:down

  # The umbrella chart publishes from main only after the cluster job of its commit passes (charts/cdr-lab/DESIGN.md).
  # It waits for the image publish jobs, because its default tags are the image commits.
  cdr-lab-chart-publish:
    needs: [changes, chart, cluster, register-image-publish, dataholder-image-publish, cdrlab-image-publish]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !cancelled() && !failure() &&
      needs.chart.result == 'success' && needs.cluster.result == 'success' && (needs.changes.outputs.chart == 'true' ||
      needs.register-image-publish.result == 'success' || needs.dataholder-image-publish.result == 'success' ||
      needs.cdrlab-image-publish.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The image commit can be an earlier commit of main.
          fetch-depth: 0

      - *install-mise

      # appVersion gives one tag, but each image has its own image commit, so the packaged values.yaml gives each tag.
      - name: Push the umbrella chart
        env:
          GH_TOKEN: ${{ github.token }}
          CHART_REPOSITORY: oci://ghcr.io/${{ github.repository }}/charts
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          commit=$(git describe --always --exclude='*')
          mise run chart:deps
          chart="$RUNNER_TEMP/cdr-lab"
          cp -R charts/cdr-lab "$chart"
          want=()
          for image in register dataholder cdrlab; do
            tag=$(mise exec -- go run ./tools/release image-commit -service "$image" -image "$IMAGE_REPOSITORY/$image")
            TAG=$tag yq --inplace ".images.$image.tag = strenv(TAG)" "$chart/values.yaml"
            want+=("$IMAGE_REPOSITORY/$image:$tag")
          done
          # The Apache License 2.0 requires the licence and the NOTICE file with each copy of the chart.
          cp LICENSE NOTICE "$chart/"
          helm package "$chart" --version "0.0.0-g$commit" --destination "$RUNNER_TEMP"
          package="$RUNNER_TEMP/cdr-lab-0.0.0-g$commit.tgz"
          got=$(helm template cdr-lab "$package" --values lab/kind/values.yaml |
            yq --no-doc '.. | select(tag == "!!map" and has("image")) | .image' | sort --unique)
          if [ "$got" != "$(printf '%s\n' "${want[@]}" | sort)" ]; then
            printf 'The chart renders these images:\n%s\nwant:\n%s\n' "$got" "$(printf '%s\n' "${want[@]}")" >&2
            exit 1
          fi
          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          mise run chart:push "$package" "$CHART_REPOSITORY"
          helm registry logout ghcr.io

  dataholder-image:
    needs: [changes, images]
    if: needs.changes.outputs.dataholder-image == 'true'
    runs-on: ubuntu-latest
    outputs:
      tested-image: ${{ steps.tested.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *install-mise

      # The pki and up tasks compile cdrlab on the runner. This job does not save the caches of the conformance and web jobs.
      - name: Restore the Go caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-conformance-${{ hashFiles('go.sum', 'mise.toml') }}-${{ github.sha }}
          restore-keys: go-conformance-${{ hashFiles('go.sum', 'mise.toml') }}-

      - name: Find the pnpm store
        id: store
        working-directory: web
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm store and the browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.store.outputs.path }}
            ~/.cache/ms-playwright
          key: web-${{ hashFiles('web/pnpm-lock.yaml', 'mise.toml') }}-${{ github.sha }}
          restore-keys: web-${{ hashFiles('web/pnpm-lock.yaml', 'mise.toml') }}-

      # The data holder is ready only after it gets the statuses from the Register, so compose also starts the Register.
      - *download-images

      - name: Start the data holder
        run: docker load --input "$RUNNER_TEMP/images.tar" && mise run up --no-build --no-telemetry wattle-bank

      - name: Check that the data holder image has no Node
        run: |
          set -euo pipefail
          files=$(docker export "$(docker-compose ps --quiet wattle-bank)" | tar -t)
          if grep -E '(^|/)(node|node_modules|npm|pnpm)(/|$)' <<< "$files"; then
            echo "The data holder image contains Node or npm packages." >&2
            exit 1
          fi

      - name: Run the browser tests
        run: mise run test:lab-web --project dataholder-console --project dataholder-bank

      # The publish job pushes the image only when it is this tested image.
      - name: Record the tested data holder image
        id: tested
        run: echo "id=$(docker inspect --format '{{.Image}}' "$(docker-compose ps --quiet wattle-bank)")" >> "$GITHUB_OUTPUT"

      - name: Show the service logs
        if: failure()
        run: docker-compose logs

      - name: Stop the lab deployment
        if: always()
        run: mise run reset

  dataholder-image-publish:
    needs: [lint, test, conformance, web, dataholder-image]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !cancelled() && !failure() &&
      needs.dataholder-image.result == 'success'
    runs-on: ubuntu-latest
    # Only this job of the image gets the permissions to push and to attest, and it never runs for a pull request.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *install-mise

      - name: Publish the data holder image
        uses: ./.github/actions/publish-image
        with:
          name: dataholder
          image: ${{ env.DATAHOLDER_IMAGE }}
          tested-image: ${{ needs.dataholder-image.outputs.tested-image }}

  datarecipient-image:
    needs: [changes, images]
    if: needs.changes.outputs.datarecipient-image == 'true'
    runs-on: ubuntu-latest
    outputs:
      tested-image: ${{ steps.tested.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *install-mise

      # The pki and up tasks compile cdrlab on the runner. This job does not save the caches of the conformance and web jobs.
      - name: Restore the Go caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-conformance-${{ hashFiles('go.sum', 'mise.toml') }}-${{ github.sha }}
          restore-keys: go-conformance-${{ hashFiles('go.sum', 'mise.toml') }}-

      - name: Find the pnpm store
        id: store
        working-directory: web
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm store and the browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.store.outputs.path }}
            ~/.cache/ms-playwright
          key: web-${{ hashFiles('web/pnpm-lock.yaml', 'mise.toml') }}-${{ github.sha }}
          restore-keys: web-${{ hashFiles('web/pnpm-lock.yaml', 'mise.toml') }}-

      - *download-images

      - name: Start the data recipient
        run: docker load --input "$RUNNER_TEMP/images.tar" && mise run up --no-build --no-telemetry sorrel

      - name: Check that the data recipient image has no Node
        run: |
          set -euo pipefail
          files=$(docker export "$(docker-compose ps --quiet sorrel)" | tar -t)
          if grep -E '(^|/)(node|node_modules|npm|pnpm)(/|$)' <<< "$files"; then
            echo "The data recipient image contains Node or npm packages." >&2
            exit 1
          fi

      - name: Run the browser tests
        run: mise run test:lab-web --project datarecipient-app

      # The publish job pushes the image only when it is this tested image.
      - name: Record the tested data recipient image
        id: tested
        run: echo "id=$(docker inspect --format '{{.Image}}' "$(docker-compose ps --quiet sorrel)")" >> "$GITHUB_OUTPUT"

      - name: Show the service logs
        if: failure()
        run: docker-compose logs

      - name: Stop the lab deployment
        if: always()
        run: mise run reset

  datarecipient-image-publish:
    needs: [lint, test, conformance, web, datarecipient-image]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !cancelled() && !failure() &&
      needs.datarecipient-image.result == 'success'
    runs-on: ubuntu-latest
    # Only this job of the image gets the permissions to push and to attest, and it never runs for a pull request.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *install-mise

      - name: Publish the data recipient image
        uses: ./.github/actions/publish-image
        with:
          name: datarecipient
          image: ${{ env.DATARECIPIENT_IMAGE }}
          tested-image: ${{ needs.datarecipient-image.outputs.tested-image }}

  # The structure of the specifications and the Verifies comments of the tests.
  # The cdrlab image has no lab job, because no compose service runs it. This job builds it and checks its linux/amd64
  # image; the Go tests check the behaviour of its commands. The cluster job also runs the image, thus this job runs
  # for each change that runs the cluster job.
  cdrlab-image:
    needs: changes
    if: needs.changes.outputs.cluster == 'true'
    runs-on: ubuntu-latest
    outputs:
      tested-image: ${{ steps.tested.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *install-mise

      - name: Build the image index
        env:
          BUILD_ID: ${{ github.run_id }}
        run: mise run build:index cli/cdrlab

      - name: Load the linux/amd64 image
        run: |
          set -euo pipefail
          mise run image:load cdrlab cdrlab
          mise run image:check cdrlab "$(docker image inspect --format '{{.Id}}' cdrlab)"

      - name: Check the image
        run: |
          set -euo pipefail
          docker run --rm cdrlab version | grep --fixed-strings "commit $(git describe --always --abbrev=40 --exclude='*'),"
          docker run --rm cdrlab -h > /dev/null
          user=$(docker image inspect --format '{{.Config.User}}' cdrlab)
          case "$user" in
            "" | 0 | 0:* | root | root:*) echo "The cdrlab image runs as root." >&2; exit 1 ;;
          esac
          container=$(docker create cdrlab)
          files=$(docker export "$container" | tar -t)
          docker rm "$container" > /dev/null
          grep --line-regexp --fixed-strings licenses/go/third-party-notices.txt <<< "$files"
          grep --line-regexp --fixed-strings licenses/NOTICE <<< "$files"

      # The publish job pushes the image only when it is this tested image.
      - name: Record the tested image
        id: tested
        run: echo "id=$(docker image inspect --format '{{.Id}}' cdrlab)" >> "$GITHUB_OUTPUT"

      - name: Save the image
        run: docker save cdrlab --output "$RUNNER_TEMP/cdrlab.tar"

      - name: Upload the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cdrlab-image
          path: ${{ runner.temp }}/cdrlab.tar
          retention-days: 1
          if-no-files-found: error

      # Only main publishes images.
      - name: Upload the image index
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cdrlab-index
          path: |
            .lab/images/cdrlab/
            .lab/images/cdrlab.spdx.json
          retention-days: 1
          # The layout is in .lab/, and the action leaves out hidden files by default.
          include-hidden-files: true
          if-no-files-found: error

  # A test job that fails or is cancelled stops the publish, but a test job that its path filter skipped does not. The
  # cdrlab-image job also runs for the cluster job, but only a change to an input of the image publishes it.
  cdrlab-image-publish:
    needs: [changes, lint, test, cdrlab-image]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !cancelled() && !failure() &&
      needs.changes.outputs.cdrlab-image == 'true' && needs.cdrlab-image.result == 'success'
    runs-on: ubuntu-latest
    # Only this job of the image gets the permissions to push and to attest, and it never runs for a pull request.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *install-mise

      - name: Publish the cdrlab image
        uses: ./.github/actions/publish-image
        with:
          name: cdrlab
          image: ${{ env.CDRLAB_IMAGE }}
          tested-image: ${{ needs.cdrlab-image.outputs.tested-image }}

  spec:
    needs: changes
    if: needs.changes.outputs.spec == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *install-mise

      - name: Check the specifications
        run: mise run lint:spec

  # Known vulnerabilities and known malicious packages (MAL- advisories) in the Go and npm dependencies.
  audit:
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *install-mise

      - name: Scan the lock files
        run: mise run audit
