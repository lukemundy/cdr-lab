# The data holder does not read this document at runtime: its tests validate the responses against it, and the UI
# generates its types from it. A test fails when an object schema does not set additionalProperties: false.
openapi: 3.0.3
info:
  title: Data holder console API
  version: "1"
  description: >-
    The same-origin API of the operator console of the mock data holder. It has no version in its path,
    because the UI and the API ship together (services/dataholder/design/operator-console-api.md).
paths:
  /api/brand:
    get:
      operationId: getBrand
      summary: The brand of the data holder instance
      responses:
        "200":
          description: The brand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        default:
          $ref: "#/components/responses/Error"
  /api/overview:
    get:
      operationId: getOverview
      summary: The counts of the records and the newest changes, from one read
      responses:
        "200":
          description: The overview. It has no name or email address of a customer, no display name of an account and no account number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        default:
          $ref: "#/components/responses/Error"
  /api/customers:
    get:
      operationId: listCustomers
      summary: One page of the customers
      parameters:
        - name: q
          in: query
          description: >-
            Only the customers whose customer number, first name, last name or email address contains this text,
            with no difference for upper and lower case. An empty value matches each customer.
          schema:
            type: string
        - name: sort
          in: query
          description: The sort key. The customer number then sorts the records with the same key.
          schema:
            type: string
            enum: [lastName, customerNumber, lastUpdated, openAccountCount, currentArrangementCount]
            default: lastName
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: The page of customers, and the number of customers in all pages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
        "400":
          description: A query parameter is not valid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCustomer
      summary: Create a customer
      description: >-
        The body gives the fields of the customer of the operator interface. The data holder creates the customer
        number. The console sends an optional field that has no value as no field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreateRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/RefusedValues"
        "409":
          description: >-
            A different customer has the emailAddress, with no difference for upper and lower case. The field error is
            at the emailAddress. The data holder created nothing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/FieldErrorsProblem"
        default:
          $ref: "#/components/responses/Error"
  /api/customers/{customerNumber}:
    get:
      operationId: getCustomer
      summary: The customer, each account with its balances, and each arrangement
      parameters:
        - $ref: "#/components/parameters/CustomerNumber"
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetail"
        "404":
          description: No customer has the customer number. The detail does not contain the customer number.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"
  /api/customers/{customerNumber}/accounts:
    post:
      operationId: createAccount
      summary: Create an account for a customer
      description: >-
        The body gives the fields of the account of the operator interface. The data holder creates the account ID,
        and the account is open. A customer can get an account also when each account of the customer is closed. The
        console sends an optional field that has no value as no field.
      parameters:
        - $ref: "#/components/parameters/CustomerNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/RefusedValues"
        "404":
          description: No customer has the customer number. The detail does not contain the customer number.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >-
            A different account has the bsb and the accountNumber. The field error is at the accountNumber. The data
            holder changed nothing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/FieldErrorsProblem"
        default:
          $ref: "#/components/responses/Error"
  /api/customers/{customerNumber}/accounts/{accountId}/close:
    post:
      operationId: closeAccount
      summary: Close an account
      description: >-
        The request has no version. It gives the arrangements that the confirmation of the close named, because a
        close of a different account can make this close the last close. The close cannot be reversed. The close of
        the last open account of the customer also ends each arrangement that the close action of the account gives
        in the detail of the customer, and the data holder sends a notice for each one.
      parameters:
        - $ref: "#/components/parameters/CustomerNumber"
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseRequest"
      responses:
        "204":
          description: The account is closed.
        "400":
          description: The body is not a JSON object with only ends. The data holder changed nothing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: >-
            No customer has the customer number, or the customer has no account with the account ID. The detail
            does not contain the identifier.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >-
            The account is closed, or the close now ends different arrangements from the arrangements in ends. The
            data holder changed nothing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"
  /api/customers/{customerNumber}/accounts/{accountId}/transactions:
    get:
      operationId: listTransactions
      summary: One page of the transactions of an account, newest first
      description: >-
        The transactions are in descending order of the posting time, or of the execution time of a transaction
        that is not posted, and then in the reverse sequence of their creation. There is no time limit.
      parameters:
        - $ref: "#/components/parameters/CustomerNumber"
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: The page of transactions, and the number of transactions in all pages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"
        "400":
          description: A query parameter is not valid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: >-
            No customer has the customer number, or the customer has no account with the account ID. The detail
            does not contain the identifier.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createTransaction
      summary: Create a transaction for an open account
      description: >-
        The body gives the fields of the transaction of the operator interface. The data holder creates the
        transactionId. Each time has an offset, and the data holder keeps it in UTC. The console sends an optional
        field that has no value as no field. The create-transaction action of the account in the detail of the
        customer shows if the rules permit a create now. The console API has no detail of a transaction: the
        Location is the path of the new transaction under the transactions of the account, and a GET of it gives
        404.
      parameters:
        - $ref: "#/components/parameters/CustomerNumber"
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreateRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/RefusedValues"
        "404":
          description: >-
            No customer has the customer number, or the customer has no account with the account ID. The detail
            does not contain the identifier.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The account is closed. The data holder changed nothing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"
  /api/customers/{customerNumber}/arrangements/{arrangementId}/withdraw:
    post:
      operationId: withdrawArrangement
      summary: Withdraw a consent for the customer
      description: >-
        The consumer asked the bank to withdraw the consent (rule 4.25(1)(b) of the CDR Rules), and the withdrawal has
        the method ALTERNATIVE_METHOD. The request has no body, because the withdrawal ends only the arrangement of the
        path. The withdrawal cannot be reversed, and the data holder sends a notice to the data recipient.
      parameters:
        - $ref: "#/components/parameters/CustomerNumber"
        - name: arrangementId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The arrangement ended.
        "404":
          description: >-
            No customer has the customer number, or the customer has no arrangement with the arrangement ID. The
            detail does not contain the identifier.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The arrangement ended. The data holder changed nothing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"
  /api/software-product-statuses:
    get:
      operationId: listSoftwareProductStatuses
      summary: The Register status of each software product that the data holder has a status for
      parameters:
        - name: registration
          in: query
          description: >-
            Only the software products that have a registration (registered), or that have no registration
            (notRegistered). With no value, each software product.
          schema:
            type: string
            enum: [registered, notRegistered]
        - name: sort
          in: query
          description: >-
            The sort key. The software product ID then sorts the records with the same key. The sort by the name
            has no difference for upper and lower case, and puts each software product with no registration last,
            in both orders.
          schema:
            type: string
            enum: [name, status]
            default: name
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: The statuses, and the time at which the data holder last got the statuses from the Register.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoftwareProductStatusList"
        "400":
          description: A query parameter is not valid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"
  /api/registrations:
    get:
      operationId: listRegistrations
      summary: Each client registration, in one response
      parameters:
        - name: sort
          in: query
          description: >-
            The sort key. The client ID then sorts the registrations with the same key. The sort by the client_name
            has no difference for upper and lower case.
          schema:
            type: string
            enum: [clientName, registeredAt, currentArrangementCount, arrangementCount]
            default: clientName
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: The client registrations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationList"
        "400":
          description: A query parameter is not valid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"
  /api/registrations/{clientId}:
    get:
      operationId: getRegistration
      summary: One client registration
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "404":
          description: No registration has the client ID. The detail does not contain the client ID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"
  /api/registrations/{clientId}/arrangements:
    get:
      operationId: listRegistrationArrangements
      summary: One page of the arrangements of the client ID of a registration, newest first
      description: >-
        Each arrangement of the client ID, also an arrangement that ended, with the name of its customer. The
        arrangements are in descending order of the time of the confirmation, and then in the order of the
        arrangementId.
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: The page of arrangements, and the number of arrangements in all pages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientArrangementList"
        "400":
          description: A query parameter is not valid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No registration has the client ID. The detail does not contain the client ID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    CustomerNumber:
      name: customerNumber
      in: path
      required: true
      schema:
        type: string
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      description: The page number. A page after the last page has no records.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    Error:
      description: An error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Created:
      description: The data holder made the record. The body is empty.
      headers:
        Location:
          description: The path of the new record in the console API, which is the start of the paths of its actions.
          required: true
          schema:
            type: string
    RefusedValues:
      description: >-
        The request body is not valid, or the rules of the data holder refuse a value. Each value that the rules
        refuse has a field error. The data holder changed nothing.
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Problem"
              - $ref: "#/components/schemas/FieldErrorsProblem"
  schemas:
    Brand:
      type: object
      additionalProperties: false
      required: [brandName]
      properties:
        brandName:
          type: string
          description: The brandName of the brand on the Register.
    Overview:
      type: object
      additionalProperties: false
      required:
        [
          customerCount,
          openAccountCount,
          closedAccountCount,
          currentArrangementCount,
          endedArrangementCount,
          registrationCount,
          notActiveSoftwareProductCount,
          changes,
        ]
      properties:
        customerCount:
          type: integer
          minimum: 0
        openAccountCount:
          type: integer
          minimum: 0
        closedAccountCount:
          type: integer
          minimum: 0
        currentArrangementCount:
          type: integer
          minimum: 0
          description: The number of arrangements that did not end.
        endedArrangementCount:
          type: integer
          minimum: 0
        registrationCount:
          type: integer
          minimum: 0
        notActiveSoftwareProductCount:
          type: integer
          minimum: 0
          description: The number of registered software products whose Register status is not ACTIVE.
        changes:
          type: array
          maxItems: 10
          description: The newest changes, newest first.
          items:
            $ref: "#/components/schemas/Change"
    Change:
      type: object
      additionalProperties: false
      required: [time, kind]
      properties:
        time:
          type: string
          format: date-time
          description: The time of the change, in UTC.
        kind:
          type: string
          enum:
            [
              CUSTOMER_CREATED,
              ACCOUNT_CREATED,
              ACCOUNT_CLOSED,
              ARRANGEMENT_CONFIRMED,
              ARRANGEMENT_ENDED,
              CLIENT_REGISTERED,
              CLIENT_UPDATED,
              CLIENT_DELETED,
            ]
          description: >-
            ARRANGEMENT_ENDED is also the end of the sharing of an arrangement, which has no endReason.
        customerNumber:
          type: string
          description: Not in the response for a change of a client registration.
        clientId:
          type: string
          description: Only in the response for a change of an arrangement or a client registration.
        clientName:
          type: string
          description: >-
            The client_name of the registration: at the confirmation for an arrangement, and at the change for a
            client registration.
        clientRegistered:
          type: boolean
          description: True when a registration has the clientId now. Only in the response with a clientId.
        productName:
          type: string
          description: Only in the response for a change of an account.
        sharingEndsAt:
          type: string
          format: date-time
          description: The end of the sharing, in UTC. Only in the response for ARRANGEMENT_CONFIRMED.
        endReason:
          type: string
          enum: [REVOKED_BY_DATA_RECIPIENT, WITHDRAWN_BY_CONSUMER, CONSUMER_NOT_ELIGIBLE, SOFTWARE_PRODUCT_REMOVED]
          description: The event that ended the arrangement. Not in the response at the end of the sharing.
        withdrawalMethod:
          type: string
          enum: [CONSUMER_DASHBOARD, ALTERNATIVE_METHOD]
          description: Only in the response for the endReason WITHDRAWN_BY_CONSUMER.
    CustomerList:
      type: object
      additionalProperties: false
      required: [data, totalRecords]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CustomerSummary"
        totalRecords:
          type: integer
          minimum: 0
    CustomerSummary:
      type: object
      additionalProperties: false
      required:
        [customerNumber, lastName, emailAddress, lastUpdated, openAccountCount, currentArrangementCount]
      properties:
        customerNumber:
          type: string
        firstName:
          type: string
          description: Not in the response when the customer has no first name.
        lastName:
          type: string
        emailAddress:
          type: string
        lastUpdated:
          type: string
          format: date-time
          description: The time of the last change to the customer, in UTC.
        openAccountCount:
          type: integer
          minimum: 0
        currentArrangementCount:
          type: integer
          minimum: 0
          description: The number of arrangements that did not end.
    CustomerDetail:
      type: object
      additionalProperties: false
      required: [customerNumber, lastName, emailAddress, lastUpdated, accounts, arrangements]
      properties:
        customerNumber:
          type: string
        firstName:
          type: string
          description: Not in the response when the customer has no first name.
        lastName:
          type: string
        emailAddress:
          type: string
        lastUpdated:
          type: string
          format: date-time
          description: The time of the last change to the customer, in UTC.
        accounts:
          type: array
          description: In the sequence of their creation.
          items:
            $ref: "#/components/schemas/Account"
        arrangements:
          type: array
          description: In the sequence of their confirmation.
          items:
            $ref: "#/components/schemas/Arrangement"
    Account:
      type: object
      additionalProperties: false
      required:
        [accountId, displayName, productCategory, productName, bsb, accountNumber, creditLimit, currentBalance,
        availableBalance, openStatus, creationDate, actions]
      properties:
        accountId:
          type: string
          description: The identifier of the account in the data holder. A data recipient gets a different accountId.
        displayName:
          type: string
        productCategory:
          $ref: "#/components/schemas/ProductCategory"
        productName:
          type: string
        bsb:
          type: string
        accountNumber:
          type: string
          description: The account number in full.
        creditLimit:
          $ref: "#/components/schemas/Amount"
        currentBalance:
          $ref: "#/components/schemas/Amount"
        availableBalance:
          $ref: "#/components/schemas/Amount"
        openStatus:
          type: string
          enum: [OPEN, CLOSED]
        creationDate:
          type: string
          format: date
          description: The date of the creation in UTC, the same value as the creationDate of the banking APIs.
        actions:
          type: array
          description: >-
            The actions that the rules permit now for the account. A closed account has no action, so it gets no
            new transaction.
          items:
            $ref: "#/components/schemas/AccountAction"
    AccountAction:
      type: object
      additionalProperties: false
      required: [action, ends]
      properties:
        action:
          type: string
          enum: [close, create-transaction]
          description: >-
            close is the last segment of the path of the action, and it cannot be reversed. create-transaction is
            a create of a transaction for the account, which ends no arrangement.
        ends:
          type: array
          description: >-
            Each arrangement that the action ends, in the sequence of their confirmation. The data holder sends a
            notice for each one. The close of an account ends arrangements only when it is the last open account of
            the customer (rule 4.26(1)(c) of the CDR Rules).
          items:
            $ref: "#/components/schemas/ArrangementEnd"
    CloseRequest:
      type: object
      additionalProperties: false
      required: [ends]
      properties:
        ends:
          type: array
          description: >-
            The arrangementId of each arrangement that the confirmation of the close named, from the ends of the
            close action. Empty when it named none. The sequence has no effect.
          items:
            type: string
    ArrangementEnd:
      type: object
      additionalProperties: false
      required: [arrangementId, softwareId, clientName]
      properties:
        arrangementId:
          type: string
          description: The cdr_arrangement_id.
        softwareId:
          type: string
        clientName:
          type: string
    Arrangement:
      type: object
      additionalProperties: false
      required:
        [arrangementId, clientId, clientRegistered, softwareId, clientName, scopes, accountIds, confirmedAt,
        sharingEndsAt, status, actions]
      properties:
        arrangementId:
          type: string
          description: The cdr_arrangement_id.
        clientId:
          type: string
          description: The client ID of the software product at the consent.
        clientRegistered:
          type: boolean
          description: >-
            True when a registration has the client ID. False after the registration is deleted, also when the
            software product registered again with a new client ID.
        softwareId:
          type: string
        clientName:
          type: string
          description: The client_name of the registration of the client at the consent.
        scopes:
          type: array
          items:
            type: string
        accountIds:
          type: array
          description: The accountId of each account that the arrangement shares. Empty when the scopes need no accounts.
          items:
            type: string
        confirmedAt:
          type: string
          format: date-time
          description: The time of the confirmation of the consent, in UTC.
        sharingEndsAt:
          type: string
          format: date-time
          description: The end of the sharing, in UTC.
        status:
          type: string
          enum: [CURRENT, ENDED]
          description: ENDED after an event ended the arrangement, and at and after the end of the sharing.
        endedAt:
          type: string
          format: date-time
          description: >-
            The time of the event that ended the arrangement before the end of its sharing, in UTC. Not in the
            response when no event ended it.
        endReason:
          type: string
          enum: [REVOKED_BY_DATA_RECIPIENT, WITHDRAWN_BY_CONSUMER, CONSUMER_NOT_ELIGIBLE, SOFTWARE_PRODUCT_REMOVED]
          description: The event that ended the arrangement. Not in the response when no event ended it.
        withdrawalMethod:
          type: string
          enum: [CONSUMER_DASHBOARD, ALTERNATIVE_METHOD]
          description: >-
            How the consumer asked for the withdrawal (rule 9.3(1)(b) of the CDR Rules). CONSUMER_DASHBOARD: the
            consumer withdrew on the consumer dashboard of the online bank site (rule 4.25(1)(a)). ALTERNATIVE_METHOD:
            the consumer asked the bank (rule 4.25(1)(b)). Only in the response for the endReason
            WITHDRAWN_BY_CONSUMER.
        noticeStatus:
          type: string
          enum: [PENDING, COMPLETE, FAILED]
          description: >-
            The status of the notice to the data recipient. Not in the response when the end needs no notice.
        noticeAttempts:
          type: array
          description: >-
            Each attempt of the notice that the data holder made, in the sequence of the attempts. Not in the response
            when the end needs no notice.
          items:
            $ref: "#/components/schemas/NoticeAttempt"
        actions:
          type: array
          description: The actions that the rules permit now for the arrangement. An arrangement that ended has no action.
          items:
            $ref: "#/components/schemas/ArrangementAction"
    ArrangementAction:
      type: object
      additionalProperties: false
      required: [action, ends]
      properties:
        action:
          type: string
          enum: [withdraw]
          description: The last segment of the path of the action. The action cannot be reversed.
        ends:
          type: array
          description: >-
            The arrangement that the action ends: a withdrawal ends only its own arrangement. The data holder sends a
            notice to the data recipient.
          items:
            $ref: "#/components/schemas/ArrangementEnd"
    NoticeAttempt:
      type: object
      additionalProperties: false
      required: [attempt, at, result]
      properties:
        attempt:
          type: integer
          minimum: 1
        at:
          type: string
          format: date-time
          description: The time of the attempt, in UTC.
        result:
          type: string
          description: >-
            The status of the response, for example "status 503", or "timeout", "no connection", "tls error" or
            "internal error". It contains no value of the response.
    TransactionList:
      type: object
      additionalProperties: false
      required: [data, totalRecords]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        totalRecords:
          type: integer
          minimum: 0
    Transaction:
      type: object
      additionalProperties: false
      description: The fields of a transaction of the operator interface. An optional field that is not set is not in the response.
      required: [transactionId, type, status, description, amount, reference]
      properties:
        transactionId:
          type: string
          description: The identifier of the transaction in the data holder. A data recipient gets a different transactionId.
        type:
          $ref: "#/components/schemas/TransactionType"
        status:
          $ref: "#/components/schemas/TransactionStatus"
        description:
          type: string
        amount:
          $ref: "#/components/schemas/Amount"
        reference:
          type: string
        postingDateTime:
          type: string
          format: date-time
        executionDateTime:
          type: string
          format: date-time
        valueDateTime:
          type: string
          format: date-time
        merchantName:
          type: string
        merchantCategoryCode:
          type: string
        billerCode:
          type: string
        billerName:
          type: string
        crn:
          type: string
        apcaNumber:
          type: string
        extendedData:
          $ref: "#/components/schemas/ExtendedData"
    ExtendedData:
      type: object
      additionalProperties: false
      required: [extensionUType, nppPayload]
      properties:
        payer:
          type: string
        payee:
          type: string
        extensionUType:
          $ref: "#/components/schemas/ExtensionUType"
        nppPayload:
          type: object
          additionalProperties: false
          required: [extendedDescription, service, serviceVersion]
          properties:
            extendedDescription:
              type: string
            service:
              $ref: "#/components/schemas/NPPService"
            serviceVersion:
              type: string
    SoftwareProductStatusList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SoftwareProductStatus"
        receivedAt:
          type: string
          format: date-time
          description: >-
            The time of the last response of the Register, in UTC. A response with no change (304) also changes
            it. Not in the response until the data holder gets the statuses one time.
    SoftwareProductStatus:
      type: object
      additionalProperties: false
      required: [softwareProductId, status]
      properties:
        softwareProductId:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, REMOVED]
        clientId:
          type: string
          description: The client ID of the registration of the software product. Absent when it has no registration.
        name:
          type: string
          description: The client_name of the registration of the software product. Absent when it has no registration.
    RegistrationList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Registration"
    Registration:
      type: object
      additionalProperties: false
      required: [registeredAt, lastUpdated, arrangementCount, currentArrangementCount, metadata]
      properties:
        registeredAt:
          type: string
          format: date-time
          description: The time of the registration, in UTC. A registration after a deletion has its own time.
        lastUpdated:
          type: string
          format: date-time
          description: The time of the last change to the registration, in UTC. The time of the registration until a PUT.
        softwareProductStatus:
          type: string
          enum: [ACTIVE, INACTIVE, REMOVED]
          description: >-
            The status of the software product that the data holder last got from the Register. Not in the response
            when the data holder has no status for it.
        arrangementCount:
          type: integer
          minimum: 0
          description: The number of all the arrangements of the client ID, also the arrangements that ended.
        currentArrangementCount:
          type: integer
          minimum: 0
          description: The number of arrangements of the client ID that did not end.
        metadata:
          $ref: "#/components/schemas/RegistrationMetadata"
    ClientArrangementList:
      type: object
      additionalProperties: false
      required: [data, totalRecords]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ClientArrangement"
        totalRecords:
          type: integer
          minimum: 0
    ClientArrangement:
      type: object
      additionalProperties: false
      required: [arrangementId, customerNumber, lastName, status, confirmedAt, sharingEndsAt]
      properties:
        arrangementId:
          type: string
          description: The cdr_arrangement_id.
        customerNumber:
          type: string
        firstName:
          type: string
          description: The first name of the customer. Not in the response when the customer has no first name.
        lastName:
          type: string
          description: The last name of the customer.
        status:
          type: string
          enum: [CURRENT, ENDED]
          description: ENDED after an event ended the arrangement, and at and after the end of the sharing.
        confirmedAt:
          type: string
          format: date-time
          description: The time of the confirmation of the consent, in UTC.
        sharingEndsAt:
          type: string
          format: date-time
          description: The end of the sharing, in UTC.
    RegistrationMetadata:
      type: object
      additionalProperties: false
      description: >-
        The registration metadata, with the names of the CDS (Dynamic Client Registration). It has no
        software_statement. An optional value that the registration does not have is not in the response.
      required:
        [client_id, client_id_issued_at, client_name, client_description, client_uri, org_id, org_name,
        redirect_uris, logo_uri, jwks_uri, revocation_uri, recipient_base_uri, token_endpoint_auth_method,
        token_endpoint_auth_signing_alg, grant_types, response_types, application_type,
        id_token_signed_response_alg, authorization_signed_response_alg, request_object_signing_alg, software_id,
        software_roles, scope]
      properties:
        client_id:
          type: string
        client_id_issued_at:
          type: integer
          description: The time of the issue of the client ID, in seconds since the Unix epoch.
        client_name:
          type: string
        client_description:
          type: string
        client_uri:
          type: string
        legal_entity_id:
          type: string
        legal_entity_name:
          type: string
        org_id:
          type: string
        org_name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        sector_identifier_uri:
          type: string
        logo_uri:
          type: string
        tos_uri:
          type: string
        policy_uri:
          type: string
        jwks_uri:
          type: string
        revocation_uri:
          type: string
        recipient_base_uri:
          type: string
        token_endpoint_auth_method:
          type: string
          enum: [private_key_jwt]
        token_endpoint_auth_signing_alg:
          $ref: "#/components/schemas/SigningAlg"
        grant_types:
          type: array
          items:
            type: string
            enum: [client_credentials, authorization_code, refresh_token]
        response_types:
          type: array
          items:
            type: string
        application_type:
          type: string
          enum: [web]
        id_token_signed_response_alg:
          $ref: "#/components/schemas/SigningAlg"
        authorization_signed_response_alg:
          $ref: "#/components/schemas/SigningAlg"
        request_object_signing_alg:
          $ref: "#/components/schemas/SigningAlg"
        software_id:
          type: string
        software_roles:
          type: string
        scope:
          type: string
          description: The scopes, separated by a space.
    SigningAlg:
      type: string
      enum: [PS256, ES256]
    Amount:
      type: string
      description: An amount in AUD, with a sign when it is negative and 2 decimal digits.
      pattern: "^-?[0-9]+\\.[0-9]{2}$"
    CustomerCreateRequest:
      type: object
      additionalProperties: false
      required: [lastName, emailAddress]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        emailAddress:
          type: string
    AccountCreateRequest:
      type: object
      additionalProperties: false
      required: [displayName, productCategory, productName, bsb, accountNumber]
      properties:
        displayName:
          type: string
        productCategory:
          type: string
          description: >-
            A value of ProductCategory. The type is a string, so that the data holder and not the schema refuses a
            different value.
        productName:
          type: string
        bsb:
          type: string
        accountNumber:
          type: string
        creditLimit:
          type: string
          description: An AmountString that is zero or more. When it is absent, it is 0.00.
    ProductCategory:
      type: string
      description: The values of BankingProductCategoryV2 in CDS 1.36.0.
      enum:
        - BUSINESS_LOANS
        - BUY_NOW_PAY_LATER
        - CRED_AND_CHRG_CARDS
        - LEASES
        - MARGIN_LOANS
        - OVERDRAFTS
        - PERS_LOANS
        - REGULATED_TRUST_ACCOUNTS
        - RESIDENTIAL_MORTGAGES
        - TERM_DEPOSITS
        - TRADE_FINANCE
        - TRANS_AND_SAVINGS_ACCOUNTS
        - TRAVEL_CARDS
    TransactionCreateRequest:
      type: object
      additionalProperties: false
      description: >-
        The fields of a transaction of the operator interface, with the names, types and enumerations of
        BankingTransactionV2 and BankingTransactionDetailV3 of the CDS. The data holder checks each value.
      required: [type, status, description, amount]
      properties:
        type:
          $ref: "#/components/schemas/TransactionType"
        status:
          $ref: "#/components/schemas/TransactionStatus"
        description:
          type: string
        amount:
          type: string
          description: An AmountString with 2 decimal digits, with a minus sign for a debit.
        reference:
          type: string
        postingDateTime:
          type: string
          description: An RFC 3339 date-time with an offset.
        executionDateTime:
          type: string
          description: An RFC 3339 date-time with an offset.
        valueDateTime:
          type: string
          description: An RFC 3339 date-time with an offset.
        merchantName:
          type: string
        merchantCategoryCode:
          type: string
        billerCode:
          type: string
        billerName:
          type: string
        crn:
          type: string
        apcaNumber:
          type: string
        extendedData:
          type: object
          additionalProperties: false
          required: [extensionUType, nppPayload]
          properties:
            payer:
              type: string
            payee:
              type: string
            extensionUType:
              $ref: "#/components/schemas/ExtensionUType"
            nppPayload:
              type: object
              additionalProperties: false
              required: [extendedDescription, service, serviceVersion]
              properties:
                extendedDescription:
                  type: string
                service:
                  $ref: "#/components/schemas/NPPService"
                serviceVersion:
                  type: string
    TransactionType:
      type: string
      enum: [DIRECT_DEBIT, FEE, INTEREST_CHARGED, INTEREST_PAID, OTHER, PAYMENT, TRANSFER_INCOMING, TRANSFER_OUTGOING]
    TransactionStatus:
      type: string
      enum: [PENDING, POSTED]
    ExtensionUType:
      type: string
      enum: [nppPayload]
    NPPService:
      type: string
      enum: [X2P1, IFTI, BSCT, CATSCT]
    FieldErrorsProblem:
      type: object
      additionalProperties: false
      description: >-
        RFC 9457 problem details for values that the data holder refuses. The errors member gives each value that the
        rules refuse. The detail says that values of the request are not valid.
      required: [type, title, status, detail, errors]
      properties:
        type:
          type: string
          enum: ["https://github.com/lukemundy/cdr-lab/blob/main/pkg/platform/problem/DESIGN.md#prob-0002"]
        title:
          type: string
          enum: [Values in the request are not valid]
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      additionalProperties: false
      required: [pointer, detail]
      properties:
        pointer:
          type: string
          description: >-
            A JSON Pointer to the field in the request body, in the URI fragment form (RFC 6901, section 6), for
            example "#/emailAddress" or "#/extendedData/payee".
        detail:
          type: string
          description: What is wrong with the value, in one sentence that names the field.
    Problem:
      type: object
      additionalProperties: false
      description: RFC 9457 problem details with the type about:blank.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          enum: [about:blank]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
