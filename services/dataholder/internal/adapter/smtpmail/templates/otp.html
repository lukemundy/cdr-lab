<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:{{.Colours.Page}}">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:{{.Colours.Page}}">
<tr><td align="center" style="padding:24px 16px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background-color:{{.Colours.Surface}};border:1px solid {{.Colours.Border}}">
<tr><td style="background-color:{{.Colours.Brand}};padding:16px 24px"><img src="cid:{{.LogoID}}" alt="{{.Bank}}" width="{{.LogoWidth}}" height="48" style="display:block;border:0;height:48px;width:{{.LogoWidth}}px"></td></tr>
<tr><td style="padding:24px;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:{{.Colours.Text}}">
<h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;color:{{.Colours.Heading}}">{{.Heading}}</h1>
{{range .Paragraphs}}<p style="margin:0 0 16px">{{.}}</p>
{{end}}</td></tr>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px">
<tr><td style="padding:16px 0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;color:{{.Colours.Muted}}"><p style="margin:0">{{.Footer}}</p></td></tr>
</table>
</td></tr>
</table>
</body>
</html>
