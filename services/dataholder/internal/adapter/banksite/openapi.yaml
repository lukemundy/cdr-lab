    Problem:
      type: object
      additionalProperties: false
      description: RFC 9457 problem details with the type about:blank.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          enum: [about:blank]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    SessionEndedProblem:
      type: object
      additionalProperties: false
      description: RFC 9457 problem details for a session cookie with no valid session.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          enum: ["https://github.com/lukemundy/cdr-lab/blob/main/services/dataholder/DESIGN.md#session"]
        title:
          type: string
          enum: [The session ended]
        status:
          type: integer
        detail:
          type: string
    FieldErrorsProblem:
      type: object
      additionalProperties: false
      description: RFC 9457 problem details for values that the data holder refuses.
      required: [type, title, status, detail, errors]
      properties:
        type:
          type: string
          enum: ["https://github.com/lukemundy/cdr-lab/blob/main/services/dataholder/DESIGN.md#site-api"]
        title:
          type: string
          enum: [Values in the request are not valid]
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      additionalProperties: false
      required: [pointer, detail]
      properties:
        pointer:
          type: string
          description: The JSON Pointer of the value in the request body, as a URI fragment, for example "#/lastName".
        detail:
          type: string
          description: A text in plain language for the consumer, which names the field with its label on the page.
    SignUpRequest:
      type: object
      additionalProperties: false
      required: [lastName, emailAddress]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        emailAddress:
          type: string
    OpenAccountRequest:
      type: object
      additionalProperties: false
      description: >-
        A creditLimit only for a product in a RevolvingProductCategory, and a loanAmount only for a product in a
        LoanProductCategory.
      required: [productId]
      properties:
        productId:
          type: string
        creditLimit:
          $ref: "#/components/schemas/AmountString"
        loanAmount:
          $ref: "#/components/schemas/AmountString"
    SignInRequest:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier:
          description: The email address or the customer number.
          type: string
    SessionCustomer:
      type: object
      additionalProperties: false
      required: [customerNumber, lastName]
      properties:
        customerNumber:
          type: string
        firstName:
          type: string
        lastName:
          type: string
