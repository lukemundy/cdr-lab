      properties:
        streamVersion:
          type: integer
          minimum: 1
        eventType:
          type: string
          enum: [ClientCertificateRegistered, ClientCertificateIssued, ClientCertificateRemoved]
        recordedAt:
          type: string
          format: date-time
          description: The time at which the Register recorded the event, in UTC.
        softwareProductId:
          type: string
        softwareProductName:
          type: string
          description: The name of the software product at the time of the event.
        thumbprint:
          type: string
          description: The SHA-256 thumbprint (RFC 8705 x5t#S256) of the client certificate.
    DataRecipientBrandHistoryEntry:
      type: object
      additionalProperties: false
      description: An event that adds or changes a data recipient brand.
      required: [streamVersion, eventType, recordedAt, brandId, brandName]
