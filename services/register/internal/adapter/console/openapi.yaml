          SoftwareProductRemoved: "#/components/schemas/SoftwareProductHistoryEntry"
          ClientCertificateRegistered: "#/components/schemas/ClientCertificateHistoryEntry"
          ClientCertificateRemoved: "#/components/schemas/ClientCertificateHistoryEntry"
          ClientCertificateIssued: "#/components/schemas/ClientCertificateHistoryEntry"
          DataRecipientCreated: "#/components/schemas/LegalEntityHistoryEntry"
          DataRecipientDetailsChanged: "#/components/schemas/LegalEntityHistoryEntry"
          SoftwareProductAdded: "#/components/schemas/SoftwareProductHistoryEntry"
          SoftwareProductDetailsChanged: "#/components/schemas/SoftwareProductHistoryEntry"
          DataRecipientBrandAdded: "#/components/schemas/DataRecipientBrandHistoryEntry"
          DataRecipientBrandDetailsChanged: "#/components/schemas/DataRecipientBrandHistoryEntry"
          DataRecipientBrandActivated: "#/components/schemas/DataRecipientBrandHistoryEntry"
