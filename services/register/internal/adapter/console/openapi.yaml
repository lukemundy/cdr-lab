        productBaseUri:
          type: string
        resourceBaseUri:
          type: string
        infosecBaseUri:
          type: string
        extensionBaseUri:
          type: string
        websiteUri:
          type: string
    DataRecipientHistory:
      type: object
      additionalProperties: false
