        streamVersion:
          type: integer
          minimum: 1
        eventType:
          type: string
          enum: [DataRecipientBrandAdded, DataRecipientBrandDetailsChanged, DataRecipientBrandActivated, DataRecipientBrandDeactivated, DataRecipientBrandRemoved]
        recordedAt:
          type: string
          format: date-time
          description: The time at which the Register recorded the event, in UTC.
        brandId:
          type: string
          description: The dataRecipientBrandId of the brand.
        brandName:
          type: string
          description: The name of the brand at the time of the event.
    DataHolderHistory:
      type: object
      additionalProperties: false
      required: [data, totalRecords]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DataHolderHistoryEntry"
        totalRecords:
          type: integer
          minimum: 0
    DataHolderHistoryEntry:
      oneOf:
        - $ref: "#/components/schemas/DataHolderLegalEntityHistoryEntry"
        - $ref: "#/components/schemas/DataHolderBrandHistoryEntry"
        - $ref: "#/components/schemas/ServerCertificateHistoryEntry"
      discriminator:
        propertyName: eventType
        mapping:
          DataHolderImported: "#/components/schemas/DataHolderLegalEntityHistoryEntry"
          DataHolderCreated: "#/components/schemas/DataHolderLegalEntityHistoryEntry"
          DataHolderDetailsChanged: "#/components/schemas/DataHolderLegalEntityHistoryEntry"
          DataHolderLegalEntityRemoved: "#/components/schemas/DataHolderLegalEntityHistoryEntry"
          DataHolderBrandAdded: "#/components/schemas/DataHolderBrandHistoryEntry"
          DataHolderBrandDetailsChanged: "#/components/schemas/DataHolderBrandHistoryEntry"
          DataHolderBrandActivated: "#/components/schemas/DataHolderBrandHistoryEntry"
          DataHolderBrandDeactivated: "#/components/schemas/DataHolderBrandHistoryEntry"
          DataHolderBrandRemoved: "#/components/schemas/DataHolderBrandHistoryEntry"
          ServerCertificateIssued: "#/components/schemas/ServerCertificateHistoryEntry"
    DataHolderLegalEntityHistoryEntry:
      type: object
      additionalProperties: false
      description: An event of a data holder legal entity. It has no other fields.
      required: [streamVersion, eventType, recordedAt]
      properties:
        streamVersion:
          type: integer
          minimum: 1
        eventType:
          type: string
          enum: [DataHolderImported, DataHolderCreated, DataHolderDetailsChanged, DataHolderLegalEntityRemoved]
        recordedAt:
          type: string
          format: date-time
          description: The time at which the Register recorded the event, in UTC.
    DataHolderBrandHistoryEntry:
      type: object
      additionalProperties: false
      description: An event that adds or changes a data holder brand.
      required: [streamVersion, eventType, recordedAt, brandId, brandName]
      properties:
        streamVersion:
          type: integer
          minimum: 1
        eventType:
          type: string
          enum: [DataHolderBrandAdded, DataHolderBrandDetailsChanged, DataHolderBrandActivated, DataHolderBrandDeactivated, DataHolderBrandRemoved]
        recordedAt:
          type: string
          format: date-time
          description: The time at which the Register recorded the event, in UTC.
        brandId:
          type: string
          description: The dataHolderBrandId of the brand, or its interimId when it has no dataHolderBrandId.
        brandName:
          type: string
          description: The name of the brand at the time of the event.
    ServerCertificateHistoryEntry:
      type: object
      additionalProperties: false
      description: An event that issues a server certificate for a data holder brand.
      required: [streamVersion, eventType, recordedAt, brandId, brandName, thumbprint]
      properties:
        streamVersion:
          type: integer
          minimum: 1
        eventType:
          type: string
          enum: [ServerCertificateIssued]
        recordedAt:
          type: string
          format: date-time
          description: The time at which the Register recorded the event, in UTC.
        brandId:
          type: string
          description: The dataHolderBrandId of the brand.
        brandName:
          type: string
          description: The name of the brand at the time of the event.
        thumbprint:
          type: string
          description: The SHA-256 thumbprint (RFC 8705 x5t#S256) of the server certificate.
    Problem:
