# The cluster:up task sets the image of compose.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail
spec:
  replicas: 1
  selector:
    matchLabels: {app: mail}
  template:
    metadata:
      labels: {app: mail}
    spec:
      enableServiceLinks: false
      containers:
        - name: mail
          image: mailpit
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: http, containerPort: 8025}
          readinessProbe:
            exec:
              command: [/mailpit, readyz]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: mail
spec:
  selector: {app: mail}
  ports:
    - {name: smtp, port: 1025}
    - {name: http, port: 8025}
