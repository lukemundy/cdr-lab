# The values of one data holder brand. An empty value with no default is required: the chart does not render without it.
# The chart also accepts the values of the bjw-s common library chart, for example resources and nodeSelector.

image:
  repository: ghcr.io/lukemundy/cdr-lab/dataholder
  # The full or the short commit ID of the image.
  tag: ""
  # Optional. With a digest, the image cannot change under the tag.
  digest: ""

# Exactly one of preset and configMap.
brand:
  # The name of a preset brand of the data holder, for example wattle-bank.
  preset: ""
  # The name of an existing ConfigMap with the files of a brand directory, for example from
  # kubectl create configmap <name> --from-file=<brand directory>.
  configMap: ""
  # The dataHolderBrandId of the brand on the Register.
  id: ""

# The base URLs that clients use for the public and the secure APIs. The public base URL is the issuer.
publicBaseURL: ""
secureBaseURL: ""

# Optional. The maximum age of a CRL in the revocation check of the client certificates, 0s or more, for example 30s.
# Without a value, the data holder uses its default of 1m. A revocation takes effect within this time.
crlMaxAge: ""

register:
  # The base URL of the public APIs of the Register. The chart adds the CDS path of the Register JWKS.
  publicBaseURL: ""
  # The interval of the requests for the statuses of the software products, more than 0s and at most 4m.
  statusInterval: ""

mail:
  # The host:port of the SMTP server for the one-time password emails.
  smtpAddress: ""
  # The sender address, with no display name.
  from: ""

# The internal listener (port 8080) serves the health probes, the operator interface and the console.
internal:
  # The Host header values (host:port) of the operator interface and the console. The probes do not check the Host
  # header.
  allowedHosts: []

operator:
  # An existing Secret with the operator token in the key token.
  tokenSecret: ""

# Lab-only.
console:
  # The console is on the internal listener, with internal.allowedHosts.
  enabled: false
bankSite:
  enabled: false
  # The Host header values (host:port) of the online bank site (port 8085). Required when the site is on.
  allowedHosts: []

telemetry:
  # The OTLP HTTP endpoint for traces, metrics and logs.
  otlpEndpoint: ""

database:
  host: ""
  port: 5432
  name: ""
  sslMode: require
  # Secrets with the keys username and password, for example the basic-auth Secrets of CloudNativePG.
  # The owner user runs the migrations. The product load and the data holder connect as the service user.
  ownerSecret: ""
  serviceSecret: ""

# The names of existing Secrets. The chart makes no keys or certificates.
pki:
  # kubernetes.io/tls Secrets (tls.crt and tls.key) of the public and the secure API listeners.
  # The online bank site also uses the public certificate.
  publicTLSSecret: ""
  secureTLSSecret: ""
  # A Secret with the CDR CA bundle in the key ca.crt.
  caBundleSecret: ""
  # Optional. A Secret with the key ca.crt that the data holder trusts when it calls the Register and software
  # products, instead of the system roots.
  publicRootSecret: ""
