{{- /* Helm's required accepts an empty list, so this check uses empty. */ -}}
{{- define "dataholder.required" -}}
  {{- if empty (index . 1) -}}
    {{- fail (printf "set %s: %s" (index . 0) (index . 2)) -}}
  {{- end -}}
  {{- index . 1 -}}
{{- end -}}

{{- define "dataholder.secretKey" -}}
valueFrom:
  secretKeyRef:
    name: {{ index . 0 }}
    key: {{ index . 1 }}
{{- end -}}

{{- define "dataholder.containerSecurityContext" -}}
allowPrivilegeEscalation: false
readOnlyRootFilesystem: true
capabilities:
  drop: [ALL]
{{- end -}}

{{- define "dataholder.secretMount" -}}
type: secret
name: {{ index . 0 }}
advancedMounts:
  main:
    main:
      - path: {{ index . 1 }}
        readOnly: true
{{- end -}}

{{- define "dataholder.values" -}}
{{- $v := .Values -}}
{{- if eq (empty $v.brand.preset) (empty $v.brand.configMap) -}}
  {{- fail "set exactly one of brand.preset (the name of a preset brand) and brand.configMap (the ConfigMap of a brand directory)" -}}
{{- end -}}
{{- $_ := include "dataholder.required" (list "internal.allowedHosts" $v.internal.allowedHosts "the Host header values of the operator interface and the console") -}}
{{- if $v.bankSite.enabled -}}
  {{- $_ = include "dataholder.required" (list "bankSite.allowedHosts" $v.bankSite.allowedHosts "the Host header values of the online bank site") -}}
{{- end -}}
{{- $image := dict
  "repository" $v.image.repository
  "tag" (include "dataholder.required" (list "image.tag" ($v.image.tag | default $.Chart.AppVersion) "the commit ID of the data holder image, or a chart with an appVersion"))
  "digest" $v.image.digest
-}}
{{- $database := dict
  "PGHOST" (include "dataholder.required" (list "database.host" $v.database.host "the PostgreSQL host"))
  "PGPORT" ($v.database.port | toString)
  "PGDATABASE" (include "dataholder.required" (list "database.name" $v.database.name "the database of the brand"))
  "PGSSLMODE" $v.database.sslMode
-}}
{{- with $v.telemetry.otlpEndpoint }}
{{- $_ := set $database "OTEL_EXPORTER_OTLP_ENDPOINT" . }}
{{- end }}
{{- $brand := dict "DATA_HOLDER_BRAND" $v.brand.preset -}}
{{- if $v.brand.configMap -}}
  {{- $brand = dict "DATA_HOLDER_BRAND_DIR" "/brand" -}}
{{- end -}}
{{- $owner := include "dataholder.required" (list "database.ownerSecret" $v.database.ownerSecret "the Secret of the owner user") -}}
{{- $service := include "dataholder.required" (list "database.serviceSecret" $v.database.serviceSecret "the Secret of the service user") -}}
{{- $register := include "dataholder.required" (list "register.publicBaseURL" $v.register.publicBaseURL "the base URL of the public APIs of the Register") -}}
defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

controllers:
  main:
    replicas: 1
    # One pod at a time, because the sessions are in the memory of the process.
    strategy: Recreate
    initContainers:
      migrate:
        order: 1
        image: {{ toYaml $image | nindent 10 }}
        args: [migrate]
        env:
          {{- toYaml $database | nindent 10 }}
          PGUSER: {{ include "dataholder.secretKey" (list $owner "username") | nindent 12 }}
          PGPASSWORD: {{ include "dataholder.secretKey" (list $owner "password") | nindent 12 }}
        securityContext: {{ include "dataholder.containerSecurityContext" . | nindent 10 }}
      # Loads the product catalogue of the brand when the data holder has no products.
      seed:
        order: 2
        image: {{ toYaml $image | nindent 10 }}
        args: [seed, -if-empty]
        env:
          {{- toYaml $database | nindent 10 }}
          {{- toYaml $brand | nindent 10 }}
          PGUSER: {{ include "dataholder.secretKey" (list $service "username") | nindent 12 }}
          PGPASSWORD: {{ include "dataholder.secretKey" (list $service "password") | nindent 12 }}
        securityContext: {{ include "dataholder.containerSecurityContext" . | nindent 10 }}
    containers:
      main:
        image: {{ toYaml $image | nindent 10 }}
        args: [serve]
        env:
          {{- toYaml $database | nindent 10 }}
          {{- toYaml $brand | nindent 10 }}
          PGUSER: {{ include "dataholder.secretKey" (list $service "username") | nindent 12 }}
          PGPASSWORD: {{ include "dataholder.secretKey" (list $service "password") | nindent 12 }}
          DATA_HOLDER_BRAND_ID: {{ include "dataholder.required" (list "brand.id" $v.brand.id "the dataHolderBrandId of the brand on the Register") | quote }}
          PUBLIC_BASE_URL: {{ include "dataholder.required" (list "publicBaseURL" $v.publicBaseURL "the base URL of the public APIs") }}
          PUBLIC_TLS_CERT_FILE: /tls/public/tls.crt
          PUBLIC_TLS_KEY_FILE: /tls/public/tls.key
          SECURE_BASE_URL: {{ include "dataholder.required" (list "secureBaseURL" $v.secureBaseURL "the base URL of the secure APIs") }}
          SECURE_TLS_CERT_FILE: /tls/secure/tls.crt
          SECURE_TLS_KEY_FILE: /tls/secure/tls.key
          CDR_CA_BUNDLE_FILE: /pki/ca-bundle/ca.crt
          {{- if $v.crlMaxAge }}
          CRL_MAX_AGE: {{ $v.crlMaxAge | quote }}
          {{- end }}
          {{- if $v.pki.publicRootSecret }}
          SSL_CERT_FILE: /pki/public-root/ca.crt
          {{- end }}
          REGISTER_PUBLIC_BASE_URL: {{ $register }}
          REGISTER_JWKS_URL: {{ printf "%s/cdr-register/v1/jwks" (trimSuffix "/" $register) }}
          REGISTER_STATUS_INTERVAL: {{ include "dataholder.required" (list "register.statusInterval" $v.register.statusInterval "the interval of the Register statuses") | quote }}
          SMTP_ADDRESS: {{ include "dataholder.required" (list "mail.smtpAddress" $v.mail.smtpAddress "the host:port of the SMTP server") | quote }}
          MAIL_FROM: {{ include "dataholder.required" (list "mail.from" $v.mail.from "the sender address of the email") | quote }}
          OPERATOR_TOKEN: {{ include "dataholder.secretKey" (list (include "dataholder.required" (list "operator.tokenSecret" $v.operator.tokenSecret "the Secret of the operator token")) "token") | nindent 12 }}
          INTERNAL_ALLOWED_HOSTS: {{ $v.internal.allowedHosts | join "," | quote }}
          CONSOLE_ENABLED: {{ $v.console.enabled | toString | quote }}
          BANK_SITE_ENABLED: {{ $v.bankSite.enabled | toString | quote }}
          {{- if $v.bankSite.enabled }}
          BANK_SITE_ALLOWED_HOSTS: {{ $v.bankSite.allowedHosts | join "," | quote }}
          {{- end }}
        ports:
          - {name: internal, containerPort: 8080}
          - {name: public, containerPort: 8081}
          - {name: secure, containerPort: 8083}
          {{- if $v.bankSite.enabled }}
          - {name: bank-site, containerPort: 8085}
          {{- end }}
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet: {path: /livez, port: 8080}
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet: {path: /readyz, port: 8080}
          startup:
            enabled: false
        securityContext: {{ include "dataholder.containerSecurityContext" . | nindent 10 }}

service:
  main:
    controller: main
    # A literal template, because the library can render the name only after it loads its defaults.
    forceRename: {{ `{{ include "bjw-s.common.lib.chart.names.fullname" . }}` | quote }}
    ports:
      internal: {port: 8080}
      public: {port: 8081}
      secure: {port: 8083}
      {{- if $v.bankSite.enabled }}
      bank-site: {port: 8085}
      {{- end }}

persistence:
  public-tls: {{ include "dataholder.secretMount" (list (include "dataholder.required" (list "pki.publicTLSSecret" $v.pki.publicTLSSecret "the TLS Secret of the public APIs")) "/tls/public") | nindent 4 }}
  secure-tls: {{ include "dataholder.secretMount" (list (include "dataholder.required" (list "pki.secureTLSSecret" $v.pki.secureTLSSecret "the TLS Secret of the secure APIs")) "/tls/secure") | nindent 4 }}
  ca-bundle: {{ include "dataholder.secretMount" (list (include "dataholder.required" (list "pki.caBundleSecret" $v.pki.caBundleSecret "the Secret of the CDR CA bundle")) "/pki/ca-bundle") | nindent 4 }}
  {{- if $v.pki.publicRootSecret }}
  public-root: {{ include "dataholder.secretMount" (list $v.pki.publicRootSecret "/pki/public-root") | nindent 4 }}
  {{- end }}
  {{- if $v.brand.configMap }}
  # A directory mount, not subPath, so that the data holder gets the files of the ConfigMap as one directory.
  brand:
    type: configMap
    name: {{ $v.brand.configMap }}
    advancedMounts:
      main:
        seed:
          - path: /brand
            readOnly: true
        main:
          - path: /brand
            readOnly: true
  {{- end }}
{{- end -}}

{{- $_ := mustMergeOverwrite .Values (include "dataholder.values" . | fromYaml) -}}
{{- include "bjw-s.common.loader.all" . -}}
