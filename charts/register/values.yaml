# The values of the Register. An empty value with no default is required: the chart does not render without it.
# The chart also accepts the values of the bjw-s common library chart, for example resources and nodeSelector.

image:
  repository: ghcr.io/lukemundy/cdr-lab/register
  # Optional. The full or the short commit ID of the image. The default is the appVersion of the chart.
  tag: ""
  # Optional. With a digest, the image cannot change under the tag.
  digest: ""

# The base URLs that clients use for the public and the secure APIs.
publicBaseURL: ""
secureBaseURL: ""
# The DNS names of the CDR server certificate that the Register issues and renews for the secure listener (8083), with
# the primary name first. For example: [register, mtls.register.example].
secureDNSNames: []
# The CRL URL of the mock CDR intermediate CA, which each certificate that the Register issues gives. The CRL is at the
# path /crl/cdr-intermediate.crl of the internal listener.
crlURL: ""

# The internal listener (port 8080) serves the health probes, the operator interface, the console and the CRL.
internal:
  # The Host header values (host:port) of the operator interface and the console. The probes and the CRL do not check
  # the Host header.
  allowedHosts: []

operator:
  # An existing Secret with the operator token in the key token.
  tokenSecret: ""

# Lab-only. The name of an existing ConfigMap with a participant seed file in the key participants.json, for example
# from kubectl create configmap <name> --from-file=participants.json=<file>.
seed:
  configMap: ""

console:
  # The console is on the internal listener, with internal.allowedHosts.
  enabled: false

telemetry:
  # The OTLP HTTP endpoint for traces, metrics and logs. Empty: the pods send no telemetry.
  otlpEndpoint: ""

database:
  host: ""
  port: 5432
  name: ""
  sslMode: require
  # Secrets with the keys username and password, for example the basic-auth Secrets of CloudNativePG.
  # The owner user runs the migrations. The Register connects as the service user.
  ownerSecret: ""
  serviceSecret: ""

# The names of existing Secrets. The chart makes no keys or certificates.
pki:
  # A kubernetes.io/tls Secret (tls.crt and tls.key) of the public API listener. The Register issues the certificate
  # of the secure API listener.
  publicTLSSecret: ""
  # A kubernetes.io/tls Secret with the certificate and the key of the mock CDR intermediate CA.
  intermediateSecret: ""
  # A Secret with the CDR CA bundle in the key ca.crt.
  caBundleSecret: ""
  # Optional. A Secret with the key ca.crt that the Register trusts when it gets the JWKS of a software product,
  # instead of the system roots.
  publicRootSecret: ""
